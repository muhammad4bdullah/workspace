function editTable(el){

    showModal(
        "Edit table",
        `
            <div class="field">
                <label>Rows</label>
                <input id="tableRows" type="number"
                    min="1" max="20"
                    value="${el.rows}">
            </div>

            <div class="field">
                <label>Columns</label>
                <input id="tableCols" type="number"
                    min="1" max="15"
                    value="${el.cols}">
            </div>
        `,
        ()=>{
            const rows=
                Math.max(
                    1,
                    Math.min(
                        20,
                        Number(
                            document.getElementById(
                                "tableRows"
                            ).value
                        )
                    )
                );

            const cols=
                Math.max(
                    1,
                    Math.min(
                        15,
                        Number(
                            document.getElementById(
                                "tableCols"
                            ).value
                        )
                    )
                );

            pushHistory();

            const data=[];

            for(let r=0;r<rows;r++){

                const row=[];

                for(let c=0;c<cols;c++){

                    row.push(
                        el.data?.[r]?.[c] ??
                        (
                            r===0
                                ? `Header ${c+1}`
                                : `Cell ${r+1},${c+1}`
                        )
                    );
                }

                data.push(row);
            }

            el.rows=rows;
            el.cols=cols;
            el.data=data;

            renderAll();
            save();
        }
    );
}


/* =========================================================
   Z INDEX
========================================================= */

function nextZ(){

    const elements=getSlide().elements;

    return elements.reduce(
        (max,e)=>
            Math.max(
                max,
                Number(e.z)||0
            ),
        0
    )+1;
}


function bringFront(){

    if(!selectedIds.length) return;

    pushHistory();

    const max=nextZ();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=max++;
            }
        }
    );

    renderAll();
    save();
}


function bringForward(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=(el.z||0)+1;
            }
        }
    );

    renderAll();
    save();
}


function sendBackward(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=Math.max(
                    0,
                    (el.z||0)-1
                );
            }
        }
    );

    renderAll();
    save();
}


function sendBack(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=0;
            }
        }
    );

    renderAll();
    save();
}


/* =========================================================
   DELETE
========================================================= */

function deleteSelected(){

    if(!selectedIds.length) return;

    pushHistory();

    const slide=getSlide();

    slide.elements=
        slide.elements.filter(
            e=>!selectedIds.includes(e.id)
        );

    selectedIds=[];

    renderAll();
    save();
}


/* =========================================================
   COPY / CUT / PASTE
========================================================= */

function copySelected(){

    if(!selectedIds.length){
        toast("Nothing selected");
        return;
    }

    const elements=
        selectedIds
            .map(id=>getElement(id))
            .filter(Boolean);

    clipboard=
        JSON.parse(
            JSON.stringify(elements)
        );

    toast(
        `${elements.length} element(s) copied`
    );
}


function cutSelected(){

    if(!selectedIds.length){
        toast("Nothing selected");
        return;
    }

    copySelected();

    deleteSelected();

    toast("Cut");
}


function pasteSelected(){

    if(!clipboard?.length){
        toast("Clipboard is empty");
        return;
    }

    pushHistory();

    const pasted=[];

    clipboard.forEach(
        original=>{

            const el=
                JSON.parse(
                    JSON.stringify(original)
                );

            el.id=uid("el");

            el.x+=25;
            el.y+=25;

            el.z=nextZ();

            getSlide().elements.push(el);

            pasted.push(el.id);
        }
    );

    selectedIds=pasted;

    renderAll();
    save();

    toast("Pasted");
}


/* =========================================================
   GROUP / UNGROUP
========================================================= */

function groupSelected(){

    if(selectedIds.length<2){

        toast("Select at least two elements");

        return;
    }

    pushHistory();

    const groupId=uid("group");

    selectedIds.forEach(
        id=>{

            const el=getElement(id);

            if(el){
                el.groupId=groupId;
            }
        }
    );

    toast("Grouped");
    renderAll();
    save();
}


function ungroupSelected(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{

            const el=getElement(id);

            if(el){
                el.groupId=null;
            }
        }
    );

    toast("Ungrouped");

    renderAll();
    save();
}


/* =========================================================
   ALIGN
========================================================= */

function alignElements(type){

    if(selectedIds.length<2){

        toast("Select multiple elements");

        return;
    }

    pushHistory();

    const elements=
        selectedIds
            .map(id=>getElement(id))
            .filter(Boolean);

    if(type==="left"){

        const x=
            Math.min(
                ...elements.map(e=>e.x)
            );

        elements.forEach(
            e=>e.x=x
        );
    }

    if(type==="center"){

        const minX=
            Math.min(
                ...elements.map(e=>e.x)
            );

        const maxRight=
            Math.max(
                ...elements.map(
                    e=>e.x+e.w
                )
            );

        const center=
            (minX+maxRight)/2;

        elements.forEach(
            e=>{
                e.x=
                    center-e.w/2;
            }
        );
    }

    if(type==="right"){

        const right=
            Math.max(
                ...elements.map(
                    e=>e.x+e.w
                )
            );

        elements.forEach(
            e=>{
                e.x=right-e.w;
            }
        );
    }

    renderAll();
    save();
}

    renderAll();

}

/* =========================================================
   INSPECTOR
========================================================= */

function renderInspector(){

    const panel=
        document.getElementById(
            "inspector"
        );

    const slide=getSlide();

    if(!slide){

        panel.innerHTML="";

        return;
    }

    if(selectedIds.length===1){

        const el=
            getElement(
                selectedIds[0]
            );

        if(el){

            renderElementInspector(
                panel,
                el
            );

            return;
        }
    }

    renderSlideInspector(
        panel,
        slide
    );
}

                100,
                165,

                {
                    fontSize:24,

                    align:"center"
                }

    else if(layout==="title-content"){

}


/* =========================================================
   SLIDE SIZE
========================================================= */

function setSlideSize(
    widthRatio,
    heightRatio
){

    pushHistory();

    const newWidth=960;

    const newHeight=
        Math.round(
            newWidth *
            heightRatio /
            widthRatio
        );

    const oldWidth=state.width;
    const oldHeight=state.height;

    const sx=newWidth/oldWidth;
    const sy=newHeight/oldHeight;

    state.width=newWidth;
    state.height=newHeight;

    state.slides.forEach(
        slide=>{
            slide.elements.forEach(
                el=>{
                    el.x*=sx;
                    el.y*=sy;
                    el.w*=sx;
                    el.h*=sy;
                }
            );
        }
    );

    renderAll();
    save();
}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom(){

    const stage=
        document.getElementById(
            "slideStage"
        );

    const canvasScroll=
        document.getElementById(
            "canvasScroll"
        );

    const fitScale=getCanvasFitScale();

    const scale=
        state.zoom/100*fitScale;

    canvasScroll.style.overflow=
        state.zoom>100
            ? "auto"
            : "hidden";

    stage.style.transform=
        `scale(${scale})`;

    stage.style.margin=
        `${(state.height*(scale-1))/2}px
         ${(state.width*(scale-1))/2}px`;

    document.getElementById(
        "zoomSlider"
    ).value=Math.max(
        25,
        Math.min(200,Math.round(scale*100))
    );

    document.getElementById(
        "zoomLabel"
    ).textContent=
        Math.round(scale*100)+"%";
}

function getCanvasFitScale(){

    const canvasScroll=document.getElementById(
        "canvasScroll"
    );

    return Math.min(
        1,
        Math.max(0.1,(canvasScroll.clientWidth-24)/state.width),
        Math.max(0.1,(canvasScroll.clientHeight-24)/state.height)
    );
}


function setZoom(value){

    state.zoom=
        Math.max(
            25,
            Math.min(
                200,
                Number(value)
            )
        );

    applyZoom();
}


function zoomIn(){

    setZoom(
        state.zoom+10
    );
}


function zoomOut(){

    setZoom(
        state.zoom-10
    );


}


/* =========================================================
   PRESENTATION
========================================================= */

function startPresentation(){

    presentationIndex=
        state.activeSlide;

    renderPresentation();

    document.getElementById(
        "presentation"
    ).classList.add("open");
}


function renderPresentation(){

    const slide=
        state.slides[presentationIndex];

    if(!slide) return;

    const container=
        document.getElementById(
            "presentationSlide"
        );

    const maxWidth=
        window.innerWidth*.94;

    const maxHeight=
        window.innerHeight*.88;

    const scale=
        Math.min(
            maxWidth/state.width,
            maxHeight/state.height
        );

    container.style.width=
        state.width*scale+"px";

    container.style.height=
        state.height*scale+"px";

    container.className="presentation-slide";

    if(PRESENTATION_TRANSITIONS.some(
        effect=>effect.id===slide.transition
    )){
        container.classList.add(
            `transition-${slide.transition}`
        );
    }

    container.innerHTML=
        renderSlideStaticHTML(
            slide,
            false,
            true
        );

    document.getElementById(
        "presentationCounter"
    ).textContent=
        `${presentationIndex+1} / ${state.slides.length}`;
}


function stopPresentation(){

    document.getElementById(
        "presentation"
    ).classList.remove("open");
}


function nextPresentation(){

    if(
        presentationIndex<
        state.slides.length-1
    ){

        presentationIndex++;

        renderPresentation();
    }
}


function previousPresentation(){

    if(presentationIndex>0){

        presentationIndex--;

        renderPresentation();
    }
}

).addEventListener(

        event.currentTarget.setAttribute(

            String(isOpen)
        );
    }
);

    "input",

);


/* =========================================================
   MENUS
========================================================= */

document.querySelectorAll(
    ".menu > button"
).forEach(
    button=>{

        button.addEventListener(
            "click",
            e=>{

                e.stopPropagation();

                const id=
                    "menu-"+button.dataset.menu;

                document
                    .querySelectorAll(".dropdown")
                    .forEach(
                        menu=>{
                            if(menu.id!==id){
                                menu.classList.remove(
                                    "open"
                                );
                            }
                        }
                    );

                document.getElementById(
                    id
                ).classList.toggle("open");
            }
        );
    }
);


document.addEventListener(
    "click",
    ()=>{
        document
            .querySelectorAll(".dropdown")
            .forEach(
                d=>d.classList.remove("open")
            );
    }
);


document.querySelectorAll(
    ".dropdown button"
).forEach(
    button=>{

        button.addEventListener(
            "click",
            e=>{

                e.stopPropagation();

                handleAction(
                    button.dataset.action
                );

                document
                    .querySelectorAll(".dropdown")
                    .forEach(
                        d=>d.classList.remove("open")
                    );
            }
        );
    }
);


/* =========================================================
   ACTION ROUTER
========================================================= */

function handleAction(action){

    switch(action){

        case"new":
            newPresentation();
            break;

        case"open-json":
            document.getElementById(
                "openInput"
            ).click();
            break;

        case"templates":
            showTemplateGallery();
            break;

        case"save":
            save();
            toast("Saved");
            break;

        case"export-json":
            exportJSON();
            break;

        case"export-legacy-json":
            exportLegacyJSON();
            break;
        case"export-pptx":
            exportPPTX();
            break;

        case"export-png":
            exportPNG();
            break;

        case"print":
            printSlides();
            break;

        case"rename":
            renamePresentation();
            break;

        case"undo":
            undo();
            break;

        case"redo":
            redo();
            break;

        case"cut":
            cutSelected();
            break;

        case"copy":
            copySelected();
            break;

        case"paste":
            pasteSelected();
            break;

        case"delete":
            deleteSelected();
            break;

        case"select-all":
            selectedIds=
                getSlide()
                    .elements
                    .map(e=>e.id);

            renderAll();
            break;

        case"grid":
            state.showGrid=!state.showGrid;
            renderCanvas();
            break;

        case"guides":
            state.showGuides=!state.showGuides;
            renderCanvas();
            break;

        case"zoom-in":
            zoomIn();
            break;

        case"zoom-out":
            zoomOut();
            break;

        case"zoom-reset":
            setZoom(100);
            break;

        case"fullscreen":
            toggleFullscreen();
            break;

        case"present":
            startPresentation();
            break;

        case"text":
            addText();
            break;

        case"shape":
            addShape("rounded");
            break;

        case"line":
            addLine(false);
            break;

        case"arrow":
            addLine(true);
            break;

        case"image":
            addImage();
            break;

        case"table":
            addTable();
            break;

        case"duplicate-slide":
            duplicateSlide();
            break;

        case"bold":
            toggleBold();
            break;

        case"italic":
            toggleItalic();
            break;

        case"underline":
            toggleUnderline();
            break;

        case"bring-front":
            bringFront();
            break;

        case"bring-forward":
            bringForward();
            break;

        case"send-backward":
            sendBackward();
            break;

        case"send-back":
            sendBack();
            break;

        case"group":
            groupSelected();
            break;

        case"ungroup":
            ungroupSelected();
            break;

        case"new-slide":
            addSlide();
            break;

        case"delete-slide":
            deleteSlide();
            break;

        case"rename-slide":
            renameSlide();
            break;

        case"layout-title":
            applyLayout("title");
            break;

        case"layout-title-content":
            applyLayout("title-content");
            break;

        case"layout-blank":
            applyLayout("blank");
            break;

        case"shortcuts":
            showShortcuts();
            break;

        case"about":
            showAbout();
            break;
    }
}

function createDeckTemplate(
    id,
    name,
    description,
    accent,
    dark,
    design,
    pages
){
    return {
        id,
        name,
        description,
        accent,
        dark,
        design,
        slides:pages.map((page,index)=>({
            title:page[0],
            subtitle:page[1],
            bullets:page[2],
            cover:index===0
        }))
    };
}

function showTemplateGallery(){

    const cards=PRESENTATION_TEMPLATES.map(
        template=>{
            const cover=createPresentationTemplate(
                template.id,
                true
            ).slides[0];

            return `
                <button
                    class="inspector-action"
                    data-template-id="${escapeAttr(template.id)}"
                    style="
                        text-align:left;
                        min-height:170px;
                        padding:8px;
                        border-top:4px solid ${escapeAttr(template.accent)};
                    "
                >
                    <div
                        class="template-preview"
                        data-template-preview
                        style="
                            position:relative;
                            width:100%;
                            aspect-ratio:16/9;
                            overflow:hidden;
                            margin-bottom:8px;
                            border-radius:5px;
                            background:${escapeAttr(template.dark)};
                        "
                    >
                        <div
                            class="template-preview-content"
                            style="
                                position:absolute;
                                left:0;
                                top:0;
                                width:240px;
                                height:135px;
                                transform-origin:top left;
                            "
                        >${renderSlideStaticHTML(cover,true)}</div>
                    </div>
                    <strong style="display:block;margin-bottom:4px">
                        ${escapeHTML(template.name)}
                    </strong>
                    <span style="color:var(--muted);line-height:1.35;font-size:11px">
                        ${escapeHTML(template.description)}
                    </span>
                </button>
            `;
        }
    ).join("");

    showModal(
        "Template presentations",
        `
            <p style="margin:0 0 12px;color:var(--muted)">
                ${PRESENTATION_TEMPLATES.length} original, editable designs. Choosing one replaces the current presentation.
            </p>
            <div style="
                display:grid;
                grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
                gap:8px;
                max-height:55vh;
                overflow:auto;
            ">
                ${cards}
            </div>
        `,
        ()=>{}
    );

    document.querySelectorAll(
        "[data-template-preview]"
    ).forEach(preview=>{
        const content=preview.querySelector(
            ".template-preview-content"
        );
        const scale=preview.clientWidth/240;
        content.style.transform=`scale(${scale})`;
    });

    document.querySelectorAll(
        "[data-template-id]"
    ).forEach(
        button=>{
            button.addEventListener(
                "click",
                ()=>{
                    const id=button.dataset.templateId;
                    closeModal();
                    applyPresentationTemplate(id);
                }
            );
        }
    );
}


function createPresentationTemplate(templateId,previewOnly=false){

    const template=PRESENTATION_TEMPLATES.find(
        item=>item.id===templateId
    );

    if(!template){
        throw new Error("The selected template is unavailable.");
    }

    const templateIndex=PRESENTATION_TEMPLATES.indexOf(template);
    const ink="#17243a";
    const muted="#64748b";
    const paper="#f7f6f2";
    const soft="#e7edf3";

    function addSlideText(slide,x,y,w,h,text,size,color,weight="400",font="Arial",align="left"){
        const element=createTextElement(x,y,w,h,text,{
            fontFamily:font,
            fontSize:size,
            color,
            fontWeight:weight,
            align,
            padding:0
        });
        element.animation=PRESENTATION_ANIMATIONS[
            (templateIndex+slide.elements.length)%PRESENTATION_ANIMATIONS.length
        ].id;
        element.z=slide.elements.length;
        slide.elements.push(element);
        return element;
    }

    function addSlideShape(slide,x,y,w,h,fill,shape="rectangle",rotation=0){
        const element=createShapeElement(x,y,w,h,shape);
        element.fill=fill;
        element.stroke=fill;
        element.strokeWidth=0;
        element.rotation=rotation;
        element.z=slide.elements.length;
        slide.elements.push(element);
        return element;
    }

    function addPageHeading(slide,page,index,color=ink,font="Arial"){
        addSlideText(
            slide,64,42,790,22,
            `${template.name.toUpperCase()}   /   ${String(index+1).padStart(2,"0")}`,
            12,template.accent,"700",font
        );
        addSlideText(slide,64,82,820,58,page.title,37,color,"700",font);
        addSlideText(slide,66,151,800,50,page.subtitle,18,muted,"400",font);
    }

    function addCards(slide,page,x,y,w,h,colors){
        const gap=14;
        const cols=page.bullets.length>3?2:Math.max(1,page.bullets.length);
        const rows=Math.ceil(page.bullets.length/cols);
        const cardW=(w-gap*(cols-1))/cols;
        const cardH=(h-gap*(rows-1))/rows;

        page.bullets.forEach((bullet,index)=>{
            const col=index%cols;
            const row=Math.floor(index/cols);
            const left=x+col*(cardW+gap);
            const top=y+row*(cardH+gap);
            const color=colors[index%colors.length];
            addSlideShape(slide,left,top,cardW,cardH,"#ffffff","rounded");
            addSlideShape(slide,left,top,7,cardH,color);
            addSlideText(slide,left+20,top+17,cardW-38,26,String(index+1).padStart(2,"0"),15,color,"700");
            addSlideText(slide,left+20,top+50,cardW-38,cardH-60,bullet,18,ink,"400");
        });
    }

    const pages=previewOnly
        ? template.slides.slice(0,1)
        : template.slides;

    const slides=pages.map(
        (page,index)=>{

            const slide={
                id:uid("slide"),

                    type:"solid",

function applyPresentationTemplate(templateId){

    const template=PRESENTATION_TEMPLATES.find(
        item=>item.id===templateId
    );

    if(!template){
        toast("That template is not available");
        return;
    }

    showConfirm(
        "Use template",
        `Replace the current presentation with “${template.name}”?`,
        ()=>{

            try{

                pushHistory();
                state=createPresentationTemplate(templateId);
                selectedIds=[];

                document.getElementById(
                    "presentationName"
                ).value=state.name;

                renderAll();
                save();
                toast(`${template.name} template created`);

            }catch(err){

                console.error("Could not create template",err);
                toast(
                    "Could not create template: "+
                    (err?.message||"Unexpected error")
                );
            }
        }
    );
}

const JSZIP_URL =
    "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";


function loadBrowserLibrary(
    globalName,
    url
){

    if(window[globalName]){
        return Promise.resolve(window[globalName]);
    }

    return new Promise(
        (resolve,reject)=>{

            const existing=
                document.querySelector(
                    `script[data-library="${globalName}"]`
                );

            if(existing){
                if(existing.dataset.loaded==="true"){
                    reject(
                        new Error(
                            `${globalName} did not initialize`
                        )
                    );
                    return;
                }

                if(existing.dataset.failed==="true"){
                    reject(
                        new Error(
                            `Could not load ${globalName}. Check your internet connection.`
                        )
                    );
                    return;
                }

                existing.addEventListener(
                    "load",
                    ()=>resolve(window[globalName]),
                    {once:true}
                );

                existing.addEventListener(
                    "error",
                    ()=>reject(
                        new Error(
                            `Could not load ${globalName}. Check your internet connection.`
                        )
                    ),
                    {once:true}
                );

                return;
            }

            const script=
                document.createElement("script");

            script.src=url;
            script.async=true;
            script.dataset.library=globalName;

            script.onload=()=>{
                script.dataset.loaded="true";

                if(!window[globalName]){
                    reject(
                        new Error(
                            `${globalName} did not initialize`
                        )
                    );
                    return;
                }

                resolve(window[globalName]);
            };

            script.onerror=()=>{
                script.dataset.failed="true";
                reject(
                    new Error(
                        `Could not load ${globalName}. Check your internet connection.`
                    )
                );
            };

            document.head.appendChild(script);
        }
    );
}


function pptxColor(value,fallback="FFFFFF"){

    const color=String(value||"")
        .trim()
        .replace(/^#/,"");

    return /^[0-9a-f]{6}$/i.test(color)
        ? color.toUpperCase()
        : fallback;
}


function pptxSolidFill(color,opacity=1){

    const alpha=
        opacity<1
            ? `<a:alpha val="${Math.round(Math.max(0,opacity)*100000)}"/>`
            : "";

    return `<a:solidFill><a:srgbClr val="${pptxColor(color)}">${alpha}</a:srgbClr></a:solidFill>`;
}


function pptxTransform(element){

    const left=Math.round(element.x*12700);
    const top=Math.round(element.y*12700);
    const width=Math.max(1,Math.round(element.w*12700));
    const height=Math.max(1,Math.round(element.h*12700));
    const rotation=element.rotation
        ? ` rot="${Math.round(element.rotation*60000)}"`
        : "";

    return `<a:xfrm${rotation}><a:off x="${left}" y="${top}"/><a:ext cx="${width}" cy="${height}"/></a:xfrm>`;
}


function pptxTextBody(element){

    const lines=String(element.text||"").split(/\r?\n/);
    const fontSize=Math.max(1,Math.round((element.fontSize||24)*75));
    const bold=
        String(element.fontWeight)==="700" ||
        Number(element.fontWeight)>=600
            ? ' b="1"'
            : "";
    const italic=element.fontStyle==="italic"
        ? ' i="1"'
        : "";
    const underline=element.textDecoration==="underline"
        ? ' u="sng"'
        : "";
    const align={
        center:"ctr",
        right:"r",
        justify:"just"
    }[element.align]||"l";
    const anchor={
        middle:"ctr",
        bottom:"b"
    }[element.verticalAlign]||"t";
    const font=escapeAttr(element.fontFamily||"Arial");
    const runProperties=
        `<a:rPr lang="en-US" sz="${fontSize}"${bold}${italic}${underline}>`+
        `${pptxSolidFill(element.color||"#111111")}`+
        `<a:latin typeface="${font}"/></a:rPr>`;

    const paragraphs=lines.map(
        line=>`
            <a:p>
                <a:pPr algn="${align}"/>
                <a:r>
                    ${runProperties}
                    <a:t xml:space="preserve">${escapeHTML(line)}</a:t>
                </a:r>
                <a:endParaRPr lang="en-US" sz="${fontSize}"/>
            </a:p>
        `
    ).join("");

    return `<p:txBody><a:bodyPr wrap="square" anchor="${anchor}"><a:normAutofit/></a:bodyPr><a:lstStyle/>${paragraphs}</p:txBody>`;
}


function pptxShapeXml(
    element,id,name,geometry,fill,stroke,strokeWidth,text
){

    const opacity=Math.max(0,Math.min(1,element.opacity??1));
    const shapeFill=fill
        ? pptxSolidFill(fill,opacity)
        : "<a:noFill/>";
    const line=stroke
        ? `<a:ln w="${Math.max(0,Math.round((strokeWidth||1)*12700))}">${pptxSolidFill(stroke,opacity)}</a:ln>`
        : "<a:ln><a:noFill/></a:ln>";

    return `
        <p:sp>
            <p:nvSpPr>
                <p:cNvPr id="${id}" name="${escapeAttr(name)}"/>
                <p:cNvSpPr${text?' txBox="1"':""}/>
                <p:nvPr/>
            </p:nvSpPr>
            <p:spPr>
                ${pptxTransform(element)}
                <a:prstGeom prst="${geometry}"><a:avLst/></a:prstGeom>
                ${shapeFill}
                ${line}
            </p:spPr>
            ${text?pptxTextBody(element):""}
        </p:sp>
    `;
}


function pptxImageXml(element,id,name,relationshipId){

    return `
        <p:pic>
            <p:nvPicPr>
                <p:cNvPr id="${id}" name="${escapeAttr(name)}"/>
                <p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr>
                <p:nvPr/>
            </p:nvPicPr>
            <p:blipFill>
                <a:blip r:embed="${relationshipId}"/>
                <a:stretch><a:fillRect/></a:stretch>
            </p:blipFill>
            <p:spPr>
                ${pptxTransform(element)}
                <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>

}


function pptxTableShapes(element,idStart){

    const xml=[];
    const rows=Math.max(1,element.rows||1);
    const cols=Math.max(1,element.cols||1);
    const cellWidth=element.w/cols;
    const cellHeight=element.h/rows;
    let id=idStart;

    for(let row=0;row<rows;row++){
        for(let col=0;col<cols;col++){

            const header=row===0;
            const x=element.x+col*cellWidth;
            const y=element.y+row*cellHeight;
            const cell={
                ...element,
                x,y,
                w:cellWidth,
                h:cellHeight,
                rotation:0,
                opacity:element.opacity??1,
                text:String(element.data?.[row]?.[col]??""),
                fontSize:element.fontSize||16,
                fontFamily:"Arial",
                fontWeight:header?"700":"400",
                fontStyle:"normal",
                textDecoration:"none",
                color:header
                    ? element.headerColor||"#ffffff"
                    : "#111111",
                align:"left",
                verticalAlign:"middle"
            };

            xml.push(
                pptxShapeXml(
                    cell,id++,
                    `Table cell ${row+1}-${col+1}`,
                    "rect",
                    header
                        ? element.headerFill||"#2563eb"
                        : element.cellFill||"#ffffff",
                    element.borderColor||"#94a3b8",
                    1,
                    false
                ).replace(
                    "</p:sp>",
                    `${pptxTextBody(cell)}</p:sp>`
                )
            );
        }
    }

    return {xml:xml.join(""),nextId:id};
}

function pptxSlideXml(slide,slideIndex,dimensions){

    const transitionXml={
        "fade":'<p:fade/>',
        "push-left":'<p:push dir="l"/>',
        "push-right":'<p:push dir="r"/>',
        "push-up":'<p:push dir="u"/>',
        "push-down":'<p:push dir="d"/>',
        "zoom-in":'<p:zoom dir="in"/>',
        "zoom-out":'<p:zoom dir="out"/>',
        "flip-x":'<p:blinds dir="vert"/>',
        "flip-y":'<p:blinds dir="horz"/>',
        "rotate":'<p:wheel spokes="8"/>',
        "wipe-left":'<p:wipe dir="l"/>',
        "wipe-right":'<p:wipe dir="r"/>',
        "wipe-up":'<p:wipe dir="u"/>',
        "wipe-down":'<p:wipe dir="d"/>',
        "circle":'<p:circle/>',
        "blur":'<p:dissolve/>',
        "split-horizontal":'<p:split orient="horz" dir="in"/>',
        "split-vertical":'<p:split orient="vert" dir="in"/>',
        "swivel":'<p:newsflash/>',
        "uncover":'<p:cover dir="l"/>'
    };
    const transition=Object.prototype.hasOwnProperty.call(
        transitionXml,
        slide.transition
    )
        ? `<p:transition spd="med" advClick="1">${transitionXml[slide.transition]}</p:transition>`
        : "";

    const imageRels=[];
    const items=[];
    let nextId=2;

    [...slide.elements]
        .sort((a,b)=>(a.z||0)-(b.z||0))
        .forEach(
            element=>{

                if(element.type==="table"){

                    const table=pptxTableShapes(element,nextId);
                    nextId=table.nextId;
                    items.push(table.xml);
                    return;
                }

                if(element.type==="image"){

                    const match=typeof element.src==="string"
                        ? element.src.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([\s\S]+)$/)
                        : null;

                    if(!match){
                        console.warn(
                            "Skipped image that is not embedded as a data URL",
                            element.id
                        );
                        return;
                    }

                    const mime=match[1].toLowerCase();
                    const extension={
                        "image/jpeg":"jpg",
                        "image/jpg":"jpg",
                        "image/png":"png",
                        "image/gif":"gif",
                        "image/bmp":"bmp",
                        "image/svg+xml":"svg"
                    }[mime];

                    if(!extension){
                        console.warn(
                            "Skipped unsupported PowerPoint image type",
                            mime
                        );
                        return;
                    }

                    const imageNumber=imageRels.length+1;
                    const mediaPath=`ppt/media/image${slideIndex+1}-${imageNumber}.${extension}`;
                    const relationshipId=`rId${imageNumber+1}`;

                    imageRels.push({
                        relationshipId,
                        mediaPath,
                        extension,
                        base64:match[2]
                    });

                    items.push(
                        pptxImageXml(
                            element,
                            nextId++,
                            `Image ${imageNumber}`,
                            relationshipId
                        )
                    );
                    return;
                }

                if(element.type==="text"){
                    items.push(
                        pptxShapeXml(
                            element,
                            nextId++,
                            "Text",
                            "rect",
                            element.background &&
                            element.background!=="transparent"
                                ? element.background
                                : null,
                            null,
                            0,
                            true
                        )
                    );
                    return;
                }

                if(element.type==="shape"){

                    const geometry={
                        circle:"ellipse",
                        pill:"roundRect",
                        rounded:"roundRect",
                        diamond:"diamond"
                    }[element.shape]||"rect";

                    items.push(
                        pptxShapeXml(
                            element,
                            nextId++,
                            "Shape",
                            geometry,
                            element.fill||"#3b82f6",
                            element.stroke||"#1e40af",
                            element.strokeWidth||1,
                            false
                        )
                    );
                    return;
                }

                if(element.type==="line"){

                    const arrow=element.endArrow
                        ? '<a:tailEnd type="triangle"/>'
                        : "";

                    items.push(
                        `
                            <p:sp>
                                <p:nvSpPr>
                                    <p:cNvPr id="${nextId++}" name="Line"/>
                                    <p:cNvSpPr/>
                                    <p:nvPr/>
                                </p:nvSpPr>
                                <p:spPr>
                                    ${pptxTransform(element)}
                                    <a:prstGeom prst="line"><a:avLst/></a:prstGeom>
                                    <a:noFill/>
                                    <a:ln w="${Math.max(1,Math.round((element.strokeWidth||1)*12700))}">
                                        ${pptxSolidFill(element.stroke||"#111111",element.opacity??1)}
                                        ${arrow}
                                    </a:ln>
                                </p:spPr>
                            </p:sp>
                        `
                    );
                }
            }
        );

    const cx=dimensions.width;
    const cy=dimensions.height;
    const background=pptxColor(
        slide.background?.color,
        "FFFFFF"
    );

    return {
        imageRels,
        xml:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
            <p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
                   xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
                   xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
                <p:cSld name="${escapeAttr(slide.name||`Slide ${slideIndex+1}`)}">
                    <p:bg><p:bgPr>${pptxSolidFill("#"+background)}<a:effectLst/></p:bgPr></p:bg>
                    <p:spTree>
                        <p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
                        <p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
                        ${items.join("")}
                    </p:spTree>
                </p:cSld>
                <p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr>
                ${transition}
            </p:sld>`
    };
}


async function exportPPTX(){

    try{

        save();

        const JSZip=
            await loadBrowserLibrary(
                "JSZip",
                JSZIP_URL
            );

        const zip=new JSZip();
        const dimensions={
            width:Math.round(state.width*12700),
            height:Math.round(state.height*12700)
        };

        const slideResults=state.slides.map(
            (slide,index)=>
                pptxSlideXml(slide,index,dimensions)
        );

        const imageExtensions=new Set();

        slideResults.forEach(
            (result,index)=>{
                zip.file(
                    `ppt/slides/slide${index+1}.xml`,
                    result.xml
                );

                const relationships=[
                    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>`
                ];

                result.imageRels.forEach(
                    image=>{
                        imageExtensions.add(image.extension);
                        zip.file(
                            image.mediaPath,
                            image.base64,
                            {base64:true}
                        );
                        relationships.push(
                            `<Relationship Id="${image.relationshipId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${image.mediaPath.split("/").pop()}"/>`
                        );
                    }
                );

                const sourceSlide=state.slides[index];
                const notesRelationshipId=
                    `rId${result.imageRels.length+2}`;

                if(sourceSlide.notes){

                    relationships.push(
                        `<Relationship Id="${notesRelationshipId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesSlide" Target="../notesSlides/notesSlide${index+1}.xml"/>`
                    );

                    zip.file(
                        `ppt/notesSlides/notesSlide${index+1}.xml`,
                        pptxNotesSlideXml(sourceSlide.notes)
                    );

                    zip.file(
                        `ppt/notesSlides/_rels/notesSlide${index+1}.xml.rels`,
                        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="../slides/slide${index+1}.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesMaster" Target="../notesMasters/notesMaster1.xml"/></Relationships>`
                    );
                }

                zip.file(
                    `ppt/slides/_rels/slide${index+1}.xml.rels`,
                    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${relationships.join("")}</Relationships>`
                );
            }
        );

        const contentTypes=[
            `<Default Extension="xml" ContentType="application/xml"/>`,
            `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
        ];

        const mimeByExtension={
            png:"image/png",
            jpg:"image/jpeg",
            gif:"image/gif",
            bmp:"image/bmp",
            svg:"image/svg+xml"
        };

        imageExtensions.forEach(
            extension=>{
                contentTypes.push(
                    `<Default Extension="${extension}" ContentType="${mimeByExtension[extension]}"/>`
                );
            }
        );

        contentTypes.push(
            `<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>`,
            `<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>`,
            `<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>`,
            `<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>`
        );

        const hasSpeakerNotes=state.slides.some(
            slide=>Boolean(slide.notes)
        );

        if(hasSpeakerNotes){
            contentTypes.push(
                `<Override PartName="/ppt/notesMasters/notesMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.notesMaster+xml"/>`
            );
        }

        state.slides.forEach(
            (slide,index)=>{
                contentTypes.push(
                    `<Override PartName="/ppt/slides/slide${index+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`
                );

                if(slide.notes){
                    contentTypes.push(
                        `<Override PartName="/ppt/notesSlides/notesSlide${index+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.notesSlide+xml"/>`
                    );
                }
            }
        );

        zip.file(
            "[Content_Types].xml",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">${contentTypes.join("")}</Types>`
        );

        zip.file(
            "_rels/.rels",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/></Relationships>`
        );

        const slideIds=state.slides.map(
            (_,index)=>
                `<p:sldId id="${256+index}" r:id="rId${index+2}"/>`

        const presentationRels=[
            `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>`,

                    `<Relationship Id="rId${index+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${index+1}.xml"/>`
            )
        ];

        if(hasSpeakerNotes){

                `<Relationship Id="rId${state.slides.length+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesMaster" Target="notesMasters/notesMaster1.xml"/>`

                    <p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>

                    <p:notesSz cx="6858000" cy="9144000"/>
                    <p:defaultTextStyle><a:defPPr><a:defRPr lang="en-US"/></a:defPPr></p:defaultTextStyle>

        );

                            <a:dk2><a:srgbClr val="44546A"/></a:dk2><a:lt2><a:srgbClr val="E7E6E6"/></a:lt2>

                            <a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst>

                            <a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst>
                            <a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst>
                        </a:fmtScheme>
                    </a:themeElements>
                </a:theme>`
        );

        const blob=await zip.generateAsync({
            type:"blob",
            mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation",
            compression:"DEFLATE"
        });

        downloadBlob(
            blob,
            safeFilename(state.name)+".pptx"
        );

        toast("PowerPoint downloaded");

    }catch(err){

        console.error("PowerPoint export failed",err);
        toast(

        );
    }
}


function xmlFirst(node,namespace,localName){
    return node.getElementsByTagNameNS(
        namespace,
        localName
    )[0]||null;
}


function xmlText(node){

    return Array.from(
        node.getElementsByTagNameNS(
            "http://schemas.openxmlformats.org/drawingml/2006/main",
            "p"
        )
    ).map(
        paragraph=>Array.from(
            paragraph.getElementsByTagNameNS(
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "t"
            )
        ).map(run=>run.textContent||"").join("")
    ).join("\n");
}


function pptxXmlColor(node,fallback){

    const color=
        xmlFirst(
            node,
            "http://schemas.openxmlformats.org/drawingml/2006/main",
            "srgbClr"
        );

    return color?.getAttribute("val")
        ? "#"+color.getAttribute("val")
        : fallback;
}


function normalizeZipPath(path){

    const parts=[];

    path.split("/").forEach(
        part=>{
            if(!part || part===".") return;
            if(part===".."){
                parts.pop();
            }else{
                parts.push(part);
            }
        }
    );

    return parts.join("/");
}


async function importPPTX(file){

    const JSZip=
        await loadBrowserLibrary(
            "JSZip",
            JSZIP_URL
        );

    const zip=await JSZip.loadAsync(file);
    const presentationFile=zip.file("ppt/presentation.xml");

    if(!presentationFile){
        throw new Error("This is not a valid PowerPoint presentation.");
    }

    const parser=new DOMParser();
    const presentationXml=parser.parseFromString(
        await presentationFile.async("text"),
        "application/xml"
    );

    if(presentationXml.querySelector("parsererror")){
        throw new Error("The PowerPoint presentation XML is invalid.");
    }

    const slideSize=
        xmlFirst(
            presentationXml,
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "sldSz"
        );

    const cx=Number(slideSize?.getAttribute("cx"))||12192000;
    const cy=Number(slideSize?.getAttribute("cy"))||6858000;
    const importedHeight=Math.max(1,Math.round(960*cy/cx));
    const fallbackSlidePaths=Object.keys(zip.files)
        .filter(path=>/^ppt\/slides\/slide\d+\.xml$/.test(path))
        .sort(
            (a,b)=>
                Number(a.match(/slide(\d+)/)[1])-
                Number(b.match(/slide(\d+)/)[1])
        );
    const presentationRelationshipsFile=
        zip.file("ppt/_rels/presentation.xml.rels");
    const presentationRelationships=new Map();

    if(presentationRelationshipsFile){

        const relXml=parser.parseFromString(
            await presentationRelationshipsFile.async("text"),
            "application/xml"
        );

        Array.from(relXml.getElementsByTagName("Relationship"))
            .forEach(
                rel=>{
                    const target=rel.getAttribute("Target")||"";
                    presentationRelationships.set(
                        rel.getAttribute("Id"),
                        normalizeZipPath(
                            target.startsWith("/")
                                ? target.slice(1)
                                : "ppt/"+target
                        )
                    );
                }
            );
    }

    const slideIdList=xmlFirst(
        presentationXml,
        "http://schemas.openxmlformats.org/presentationml/2006/main",
        "sldIdLst"
    );
    const relationshipNamespace=
        "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
    const orderedSlidePaths=Array.from(
        slideIdList?.getElementsByTagNameNS(
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "sldId"
        )||[]
    ).map(
        slideId=>presentationRelationships.get(
            slideId.getAttributeNS(
                relationshipNamespace,
                "id"
            )
        )
    ).filter(
        path=>path&&zip.file(path)
    );
    const slidePaths=orderedSlidePaths.length
        ? orderedSlidePaths
        : fallbackSlidePaths;

    if(!slidePaths.length){
        throw new Error("This PowerPoint file has no readable slides.");
    }

    const importedSlides=[];
    let omittedElements=0;

    for(let slideIndex=0;slideIndex<slidePaths.length;slideIndex++){

        const path=slidePaths[slideIndex];
        const slideXml=parser.parseFromString(
            await zip.file(path).async("text"),
            "application/xml"
        );

        if(slideXml.querySelector("parsererror")){
            throw new Error(`Slide ${slideIndex+1} contains invalid XML.`);
        }

        const transitionElement=slideXml.getElementsByTagNameNS(
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "transition"
        )[0];
        const transitionEffect=transitionElement
            ? Array.from(transitionElement.children).find(
                child=>child.namespaceURI===
                    "http://schemas.openxmlformats.org/presentationml/2006/main"
            )
            : null;
        const transitionDirection=transitionEffect?.getAttribute("dir");
        const transitionIdByElement={
            fade:"fade",
            push:`push-${({l:"left",r:"right",u:"up",d:"down"})[transitionDirection]||"left"}`,
            zoom:transitionDirection==="out"?"zoom-out":"zoom-in",
            blinds:transitionDirection==="horz"?"flip-y":"flip-x",
            wheel:"rotate",
            wipe:`wipe-${({l:"left",r:"right",u:"up",d:"down"})[transitionDirection]||"left"}`,
            circle:"circle",
            dissolve:"blur",
            split:transitionEffect?.getAttribute("orient")==="vert"
                ? "split-vertical"
                : "split-horizontal",
            newsflash:"swivel",
            cover:"uncover"
        };
        const importedTransition=transitionEffect
            ? transitionIdByElement[transitionEffect.localName]||"none"
            : "none";

        const importedSlide={
            id:uid("slide"),
            name:`Slide ${slideIndex+1}`,
            background:{
                type:"solid",
                color:"#ffffff"
            },
            notes:"",
            transition:importedTransition,
            elements:[]
        };

        const slideRelPath=
            path.replace(
                /slides\/slide(\d+)\.xml$/,
                "slides/_rels/slide$1.xml.rels"
            );

        const relationshipFile=zip.file(slideRelPath);
        const relationships=new Map();
        const relationshipTypes=new Map();

        if(relationshipFile){

            const relXml=parser.parseFromString(
                await relationshipFile.async("text"),
                "application/xml"
            );

            Array.from(relXml.getElementsByTagName("Relationship"))
                .forEach(
                    rel=>{
                        const target=rel.getAttribute("Target")||"";
                        relationships.set(
                            rel.getAttribute("Id"),
                            normalizeZipPath(
                                target.startsWith("/")
                                    ? target.slice(1)
                                    : "ppt/slides/"+target
                            )
                        );
                        relationshipTypes.set(
                            rel.getAttribute("Id"),
                            rel.getAttribute("Type")||""
                        );
                    }
                );
        }

        const bgNode=xmlFirst(
            slideXml,
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "bg"
        );

        if(bgNode){
            importedSlide.background.color=
                pptxXmlColor(bgNode,"#ffffff");
        }

        const tree=xmlFirst(
            slideXml,
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "spTree"
        );

        const shapeNodes=Array.from(tree?.children||[])
            .filter(node=>[
                "sp",
                "pic",
                "cxnSp",
                "graphicFrame",
                "grpSp"
            ].includes(node.localName));

        for(const node of shapeNodes){

            if(node.localName==="grpSp"){
                omittedElements++;
                continue;
            }

            const xfrm=xmlFirst(
                node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "xfrm"
            )||xmlFirst(
                node,
                "http://schemas.openxmlformats.org/presentationml/2006/main",
                "xfrm"
            );

            const offset=xmlFirst(
                xfrm||node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "off"
            );

            const extent=xmlFirst(
                xfrm||node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "ext"
            );

            if(!offset||!extent){
                omittedElements++;
                continue;
            }

            const x=Number(offset.getAttribute("x"))/cx*960;
            const y=Number(offset.getAttribute("y"))/cx*960;
            const w=Number(extent.getAttribute("cx"))/cx*960;
            const h=Number(extent.getAttribute("cy"))/cx*960;
            const rotation=Number(xfrm?.getAttribute("rot")||0)/60000;
            const spPr=xmlFirst(
                node,
                "http://schemas.openxmlformats.org/presentationml/2006/main",
                "spPr"
            );
            const geom=xmlFirst(
                spPr||node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "prstGeom"
            );
            const preset=geom?.getAttribute("prst")||"rect";
            const fill=pptxXmlColor(spPr||node,"#3b82f6");
            const stroke=pptxXmlColor(
                xmlFirst(
                    spPr||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "ln"
                )||spPr||node,
                "#1e40af"
            );
            const textBody=xmlFirst(
                node,
                "http://schemas.openxmlformats.org/presentationml/2006/main",
                "txBody"
            );

            if(node.localName==="pic"){

                const blip=xmlFirst(
                    node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "blip"
                );
                const relId=blip?.getAttributeNS(
                    "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
                    "embed"
                );
                const imagePath=relationships.get(relId);
                const imageFile=imagePath&&zip.file(imagePath);

                if(imageFile){

                    const ext=(imagePath.split(".").pop()||"png").toLowerCase();
                    const mime={
                        jpg:"image/jpeg",
                        jpeg:"image/jpeg",
                        png:"image/png",
                        gif:"image/gif",
                        bmp:"image/bmp",
                        svg:"image/svg+xml"
                    }[ext];

                    if(mime){
                        const data=await imageFile.async("base64");
                        const image=createImageElement(
                            x,y,w,h,
                            `data:${mime};base64,${data}`
                        );
                        image.rotation=rotation;
                        importedSlide.elements.push(image);
                    }else{
                        omittedElements++;
                    }
                }else{
                    omittedElements++;
                }

                continue;
            }

            if(node.localName==="graphicFrame"){

                const table=xmlFirst(
                    node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "tbl"
                );

                if(table){

                    const rows=Array.from(
                        table.getElementsByTagNameNS(
                            "http://schemas.openxmlformats.org/drawingml/2006/main",
                            "tr"
                        )
                    ).map(
                        row=>Array.from(
                            row.getElementsByTagNameNS(
                                "http://schemas.openxmlformats.org/drawingml/2006/main",
                                "tc"
                            )
                        ).map(cell=>xmlText(cell))
                    );

                    const cols=Math.max(
                        1,
                        ...rows.map(row=>row.length)
                    );

                    if(rows.length&&cols){

                        const importedTable=createTableElement(
                            x,y,w,h,rows.length,cols
                        );
                        importedTable.data=rows.map(
                            row=>Array.from(
                                {length:cols},
                                (_,index)=>row[index]||""
                            )
                        );
                        importedSlide.elements.push(importedTable);
                    }
                }else{
                    omittedElements++;
                }

                continue;
            }

            const text=xmlText(textBody||node);

            if(node.localName==="cxnSp"){

                const line=createLineElement(
                    x,y,Math.max(1,w),Math.max(1,h),
                    Boolean(
                        xmlFirst(
                            spPr||node,
                            "http://schemas.openxmlformats.org/drawingml/2006/main",
                            "tailEnd"
                        )
                    )
                );
                line.stroke=stroke;
                line.rotation=rotation;
                importedSlide.elements.push(line);
                continue;
            }

            const hasFill=Boolean(
                xmlFirst(
                    spPr||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "solidFill"
                )
            );

            if(text.trim()){

                const properties=xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "rPr"
                )||xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "defRPr"
                );

                const textColor=pptxXmlColor(
                    properties||node,
                    "#111111"
                );
                const latin=xmlFirst(
                    properties||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "latin"
                );
                const paragraph=xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "pPr"
                );
                const alignCode=paragraph?.getAttribute("algn");
                const bodyProperties=xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "bodyPr"
                );

                const textElement=createTextElement(
                    x,y,Math.max(1,w),Math.max(1,h),text,
                    {
                        fontFamily:latin?.getAttribute("typeface")||"Arial",
                        fontSize:Math.max(
                            8,
                            Number(properties?.getAttribute("sz")||1800)/100*4/3
                        ),
                        fontWeight:properties?.getAttribute("b")==="1"
                            ? "700"
                            : "400",
                        fontStyle:properties?.getAttribute("i")==="1"
                            ? "italic"
                            : "normal",
                        textDecoration:properties?.getAttribute("u") &&
                                       properties.getAttribute("u")!=="none"
                            ? "underline"
                            : "none",
                        color:textColor,
                        align:alignCode==="ctr"
                            ? "center"
                            : alignCode==="r"
                                ? "right"
                                : "left",
                        verticalAlign:bodyProperties?.getAttribute("anchor")==="ctr"
                            ? "middle"
                            : bodyProperties?.getAttribute("anchor")==="b"
                                ? "bottom"
                                : "top"
                    }
                );
                textElement.rotation=rotation;
                importedSlide.elements.push(textElement);

                if(hasFill){
                    const shape=createShapeElement(x,y,w,h,
                        preset==="ellipse"
                            ? "circle"
                            : preset==="roundRect"
                                ? "rounded"
                                : preset==="diamond"
                                    ? "diamond"
                                    : "rectangle"
                    );
                    shape.fill=fill;
                    shape.stroke=stroke;
                    shape.rotation=rotation;
                    shape.z=-1;
                    importedSlide.elements.push(shape);
                }
            }else if(node.localName==="sp"&&hasFill){

                const shape=createShapeElement(
                    x,y,w,h,
                    preset==="ellipse"
                        ? "circle"
                        : preset==="roundRect"
                            ? "rounded"
                            : preset==="diamond"
                                ? "diamond"
                                : "rectangle"
                );
                shape.fill=fill;
                shape.stroke=stroke;
                shape.rotation=rotation;
                importedSlide.elements.push(shape);
            }else{
                omittedElements++;
            }
        }

        const notesRelationship=
            Array.from(relationshipTypes.entries())
                .find(([,type])=>type.endsWith("/notesSlide"));

        if(notesRelationship){

            const notesPath=relationships.get(
                notesRelationship[0]
            );
            const notesFile=notesPath&&zip.file(notesPath);

            if(notesFile){

                const notesXml=parser.parseFromString(
                    await notesFile.async("text"),
                    "application/xml"
                );
                const noteShapes=Array.from(
                    notesXml.getElementsByTagNameNS(
                        "http://schemas.openxmlformats.org/presentationml/2006/main",
                        "sp"
                    )
                );
                const bodyPlaceholder=noteShapes.find(
                    shape=>{
                        const placeholder=xmlFirst(
                            shape,
                            "http://schemas.openxmlformats.org/presentationml/2006/main",
                            "ph"
                        );

                        return placeholder?.getAttribute("type")==="body";
                    }
                );

                if(bodyPlaceholder){
                    importedSlide.notes=xmlText(
                        xmlFirst(
                            bodyPlaceholder,
                            "http://schemas.openxmlformats.org/presentationml/2006/main",
                            "txBody"
                        )
                    );
                }
            }
        }

        importedSlides.push(importedSlide);
    }

    return {
        name:file.name.replace(/\.pptx$/i,"")||"Imported Presentation",
        width:960,
        height:importedHeight,
        theme:"light",
        slides:importedSlides,
        activeSlide:0,
        zoom:100,
        showGrid:false,
        showGuides:true,
        omittedElements
    };
}


/* =========================================================
   IMPORT JSON
========================================================= */

document.getElementById(
    "openInput"
).addEventListener(
    "change",
    async e=>{

        const file=e.target.files?.[0];

        if(!file) return;

        try{

            let imported;
            if(/\.pptx$/i.test(file.name)){
                imported=await importPPTX(file);
            }else if(/\.azps$/i.test(file.name)){
                const envelope=AZpaceFiles.parse(
                    await file.text(),
                    "presentation"
                );
                if(
                    !envelope.data.state||
                    typeof envelope.data.state!=="object"||
                    Array.isArray(envelope.data.state)
                ){
                    throw new Error("The A-Zpace presentation data is invalid.");
                }
                imported={...envelope.data.state};
                imported.createdAt=envelope.metadata.createdAt;
                imported.modifiedAt=envelope.metadata.modifiedAt;
            }else{
                imported=JSON.parse(await file.text());
            }

            if(
                !imported ||
                !Array.isArray(
                    imported.slides
                ) ||
                !imported.slides.length
            ){

                throw new Error(
                    "Invalid presentation file"
                );
            }

            const {
                omittedElements=0,
                ...presentation
            }=imported;

            pushHistory();

            state=Object.assign(
                state,
                presentation
            );

            selectedIds=[];

            document.getElementById(
                "presentationName"
            ).value=state.name;

            renderAll();
            save();

            toast("Presentation opened");

            if(omittedElements){
                toast(
                    `Opened with ${omittedElements} unsupported item(s) omitted`
                );
            }

        }catch(err){

            console.error("Could not open presentation",err);

            toast(
                "Could not open presentation: "+
                (err?.message||"Invalid file")
            );
        }

        e.target.value="";
    }
);

   EXPORT PNG
========================================================= */

async function exportPNG(){

    const slide=getSlide();

    if(!slide) return;

    const canvas=
        document.createElement("canvas");

    const scale=2;

    canvas.width=
        state.width*scale;

    canvas.height=
        state.height*scale;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle=
        slide.background?.color ||
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const svg=
        `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${state.width}"
            height="${state.height}"
        >
            <foreignObject
                width="100%"
                height="100%"
            >
                ${renderSlideStaticHTML(
                    slide,
                    false
                )}
            </foreignObject>
        </svg>
        `;

    const blob=
        new Blob(
            [svg],
            {
                type:"image/svg+xml"
            }
        );

    const url=
        URL.createObjectURL(blob);

    const image=
        new Image();

    image.onload=()=>{

        ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
        );

        URL.revokeObjectURL(url);

        canvas.toBlob(
            png=>{
                downloadBlob(
                    png,
                    safeFilename(
                        slide.name
                    )+".png"
                );
            },
            "image/png"
        );
    };

    image.onerror=()=>{

        URL.revokeObjectURL(url);

        toast(
            "PNG export is not supported by this browser"
        );
    };

    image.src=url;
}


/* =========================================================
   PRINT
========================================================= */

function printSlides(){

    const original=
        document.body.innerHTML;

    let html="";

    state.slides.forEach(
        slide=>{

            html+=`
                <div
                    class="print-slide"
                    style="
                        width:100vw;
                        aspect-ratio:${state.width}/${state.height};
                        position:relative;
                        overflow:hidden;
                        background:${escapeAttr(
                            slide.background?.color ||
                            "#ffffff"
                        )};
                        page-break-after:always;
                    "
                >
                    ${renderSlideStaticHTML(
                        slide,
                        false
                    )}
                </div>
            `;
        }
    );

    const printWindow=
        window.open(
            "",
            "_blank"
        );

    if(!printWindow){

        toast("Popup blocked");

        return;
    }

    printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>${escapeHTML(state.name)}</title>
            <style>
                @page{
                    margin:0;
                    size:auto;
                }

                html,body{
                    margin:0;
                    padding:0;
                    background:white;
                }
            </style>
        </head>

        <body>
            ${html}
        <\/body>
        <\/html>
    `);

    printWindow.document.close();

    printWindow.focus();

    setTimeout(
        ()=>{
            printWindow.print();
        },
        500
    );
}
