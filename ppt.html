<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slides — A-Zpace</title>
<link rel="stylesheet" href="azpace-auth.css">
<script>document.documentElement.classList.add("azpace-auth-pending");</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="azpace-auth.js"></script>
<script src="azpace-entitlements.js"></script>
<script src="azpace-auth-ui.js"></script>

<style>
:root{
    --bg:#f3f4f6;
    --panel:#ffffff;
    --panel2:#f8f9fb;
    --border:#d9dde5;
    --text:#202124;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent2:#1d4ed8;
    --danger:#dc2626;
    --shadow:0 4px 18px rgba(0,0,0,.08);
    --toolbar:#ffffff;
    --canvas:#e9edf3;
    --selection:#2563eb;
}

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:46px;
    display:flex;
    align-items:center;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    padding:0 10px;
    gap:7px;
    flex-shrink:0;
}

.brand{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:185px;
}

.brand-icon{
    width:29px;
    height:29px;
    border-radius:7px;
    background:#f97316;
    color:white;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:15px;
}

.brand-name{
    font-weight:700;
    font-size:14px;
}

.file-name{
    border:1px solid transparent;
    outline:none;
    background:transparent;
    padding:5px 8px;
    border-radius:5px;
    min-width:170px;
    color:var(--text);
}

.file-name:hover,
.file-name:focus{
    border-color:var(--border);
    background:var(--panel2);
}

.top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:4px;
}

.icon-btn,
.toolbar-btn{
    height:31px;
    min-width:31px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text);
    border-radius:5px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 8px;
}

.icon-btn:hover,
.toolbar-btn:hover{
    background:var(--panel2);
    border-color:var(--border);
}

.icon-btn.active,
.toolbar-btn.active{
    background:#dbeafe;
    color:#1d4ed8;
}

.primary-btn{
    border:0;
    background:var(--accent);
    color:white;
    border-radius:5px;
    padding:7px 12px;
    font-weight:600;
}

.primary-btn:hover{
    background:var(--accent2);
}

/* =========================================================
   MENUS
========================================================= */

.menubar{
    height:35px;
    display:flex;
    align-items:center;
    gap:2px;
    padding:0 10px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    flex-shrink:0;
}

.menu{
    position:relative;
}

.menu > button{
    border:0;
    background:transparent;
    color:var(--text);
    padding:6px 10px;
    border-radius:5px;
}

.menu > button:hover{
    background:var(--panel2);
}

.dropdown{
    position:absolute;
    top:31px;
    left:0;
    width:225px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:7px;
    padding:5px;
    z-index:10000;
    display:none;
}

.dropdown.open{
    display:block;
}

.dropdown button{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    text-align:left;
    padding:8px 10px;
    border-radius:5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.dropdown button:hover{
    background:var(--panel2);
}

.dropdown .shortcut{
    color:var(--muted);
    font-size:11px;
}

.dropdown .separator{
    height:1px;
    background:var(--border);
    margin:5px 0;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    min-height:45px;
    display:flex;
    align-items:center;
    gap:4px;
    padding:5px 9px;
    border-bottom:1px solid var(--border);
    background:var(--toolbar);
    overflow-x:auto;
    flex-shrink:0;
}

.toolbar-group{
    display:flex;
    align-items:center;
    gap:2px;
    padding-right:6px;
    margin-right:3px;
    border-right:1px solid var(--border);
}

.toolbar-group:last-child{
    border-right:0;
}

.toolbar-select{
    height:31px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    border-radius:5px;
    padding:0 7px;
    outline:none;
}

.font-select{
    width:135px;
}

.size-select{
    width:63px;
}

.color-wrap{
    position:relative;
    display:flex;
    align-items:center;
}

.color-wrap input[type=color]{
    width:30px;
    height:30px;
    padding:2px;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--panel);
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

.left-panel{
    width:235px;
    border-right:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.panel-header{
    height:43px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px;
    border-bottom:1px solid var(--border);
    font-size:13px;
    font-weight:700;
}

.panel-tools{
    display:flex;
    gap:3px;
}

.small-btn{
    width:28px;
    height:28px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:5px;
    color:var(--text);
}

.small-btn:hover{
    background:var(--panel2);
}

.slide-search{
    padding:8px;
    border-bottom:1px solid var(--border);
}

.slide-search input{
    width:100%;
    height:31px;
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:5px;
    padding:0 9px;
    color:var(--text);
    outline:none;
}

.thumbnails{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.thumbnail{
    position:relative;
    margin-bottom:10px;
    cursor:pointer;
    user-select:none;
}

.thumbnail-number{
    position:absolute;
    left:-1px;
    top:50%;
    transform:translate(-100%,-50%);
    color:var(--muted);
    font-size:11px;
    width:22px;
    text-align:center;
}

.thumbnail-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border:2px solid transparent;
    background:#fff;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.1);
}

.thumbnail.active .thumbnail-frame{
    border-color:var(--accent);
}

.thumbnail:hover .thumbnail-frame{
    border-color:#93c5fd;
}

.thumbnail.dragging{
    opacity:.45;
}

.thumbnail-title{
    font-size:11px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    color:var(--muted);
}

/* =========================================================
   CANVAS
========================================================= */

.canvas-area{
    flex:1;
    min-width:0;
    position:relative;
    background:var(--canvas);
    overflow:hidden;
}

.canvas-scroll{
    width:100%;
    height:100%;
    overflow:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:50px;
}

.slide-stage{
    position:relative;
    flex-shrink:0;
    background:white;
    box-shadow:0 10px 35px rgba(0,0,0,.18);
    overflow:hidden;
}

.slide{
    position:absolute;
    inset:0;
    overflow:hidden;
    transform-origin:top left;
}

.grid-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    display:none;
    background-image:
        linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);
    background-size:20px 20px;
}

.grid-overlay.visible{
    display:block;
}

.guides{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:9998;
}

.guide-v,
.guide-h{
    position:absolute;
    background:#ef4444;
    opacity:.7;
}

.guide-v{
    top:0;
    bottom:0;
    width:1px;
}

.guide-h{
    left:0;
    right:0;
    height:1px;
}

/* =========================================================
   ELEMENTS
========================================================= */

.element{
    position:absolute;
    user-select:none;
    cursor:move;
}

.element.selected{
    outline:2px solid var(--selection);
    outline-offset:1px;
}

.element.multi-selected{
    outline:2px solid #60a5fa;
    outline-offset:1px;
}

.element-content{
    width:100%;
    height:100%;
    overflow:hidden;
}

.text-element{
    padding:5px;
    white-space:pre-wrap;
    word-break:break-word;
}

.shape-element{
    width:100%;
    height:100%;
}

.image-element{
    width:100%;
    height:100%;
    object-fit:fill;
    pointer-events:none;
}

.line-element{
    width:100%;
    height:100%;
    overflow:visible;
}

.selection-handle{
    position:absolute;
    width:8px;
    height:8px;
    background:white;
    border:1px solid var(--accent);
    border-radius:2px;
    z-index:100;
}

.handle-nw{left:-5px;top:-5px;cursor:nwse-resize;}
.handle-n{left:50%;top:-5px;transform:translateX(-50%);cursor:ns-resize;}
.handle-ne{right:-5px;top:-5px;cursor:nesw-resize;}
.handle-e{right:-5px;top:50%;transform:translateY(-50%);cursor:ew-resize;}
.handle-se{right:-5px;bottom:-5px;cursor:nwse-resize;}
.handle-s{left:50%;bottom:-5px;transform:translateX(-50%);cursor:ns-resize;}
.handle-sw{left:-5px;bottom:-5px;cursor:nesw-resize;}
.handle-w{left:-5px;top:50%;transform:translateY(-50%);cursor:ew-resize;}

.rotation-handle{
    position:absolute;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--accent);
    top:-27px;
    left:50%;
    transform:translateX(-50%);
    cursor:grab;
}

.rotation-line{
    position:absolute;
    width:1px;
    height:20px;
    background:var(--accent);
    left:50%;
    top:-20px;
}

/* =========================================================
   RIGHT PANEL
========================================================= */

.right-panel{
    width:285px;
    border-left:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    overflow:hidden;
}

.inspector-tabs{
    display:flex;
    border-bottom:1px solid var(--border);
}

.inspector-tabs button{
    flex:1;
    height:39px;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:12px;
}

.inspector-tabs button.active{
    color:var(--accent);
    border-bottom:2px solid var(--accent);
    font-weight:700;
}

.inspector-content{
    flex:1;
    overflow:auto;
    padding:12px;
}

.inspector-section{
    margin-bottom:17px;
}

.inspector-title{
    font-size:12px;
    font-weight:700;
    margin-bottom:9px;
}

.field{
    margin-bottom:8px;
}

.field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    min-height:31px;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--panel2);
    color:var(--text);
    padding:5px 7px;
    outline:none;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.inspector-color{
    width:100%;
    height:34px;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--panel);
    padding:2px;
}

.button-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.inspector-action{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:5px;
    padding:7px;
    font-size:11px;
}

.inspector-action:hover{
    background:#e5e7eb;
}

/* =========================================================
   NOTES
========================================================= */

.notes-panel{
    height:135px;
    border-top:1px solid var(--border);
    background:var(--panel);
    flex-shrink:0;
    display:flex;
    flex-direction:column;
}

.notes-header{
    height:32px;
    padding:0 12px;
    display:flex;
    align-items:center;
    font-size:12px;
    font-weight:700;
    border-bottom:1px solid var(--border);
}

.notes-panel textarea{
    flex:1;
    resize:none;
    border:0;
    outline:none;
    padding:8px 12px;
    background:var(--panel);
    color:var(--text);
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar{
    height:27px;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:16px;
    background:var(--panel);
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:11px;
    flex-shrink:0;
}

.status-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
}

.zoom-slider{
    width:100px;
}

/* =========================================================
   MODALS
========================================================= */

.modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.42);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50000;
}

.modal-backdrop.open{
    display:flex;
}

.modal{
    width:430px;
    max-width:calc(100vw - 30px);
    max-height:calc(100vh - 40px);
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 18px 55px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    font-weight:700;
}

.modal-body{
    padding:16px;
}

.modal-footer{
    padding:12px 16px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:flex-end;
    gap:7px;
}

.modal-btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    padding:7px 12px;
    border-radius:5px;
}

.modal-btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:white;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:45px;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    background:#111827;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    font-size:12px;
    transition:.2s;
    z-index:100000;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================================================
   CONTEXT MENU
========================================================= */

.context-menu{
    position:fixed;
    width:210px;
    background:var(--panel);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:7px;
    padding:5px;
    z-index:70000;
    display:none;
}

.context-menu.open{
    display:block;
}

.context-menu button{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    padding:8px 9px;
    text-align:left;
    border-radius:5px;
    font-size:12px;
}

.context-menu button:hover{
    background:var(--panel2);
}

/* =========================================================
   PRESENTATION
========================================================= */

.presentation{
    position:fixed;
    inset:0;
    background:#000;
    z-index:100000;
    display:none;
    align-items:center;
    justify-content:center;
}

.presentation.open{
    display:flex;
}

.presentation-slide{
    position:relative;
    background:white;
    overflow:hidden;
    box-shadow:0 0 40px rgba(255,255,255,.08);
}

.presentation-controls{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    padding:5px;
    background:rgba(0,0,0,.65);
    border-radius:8px;
    opacity:.3;
    transition:.2s;
}

.presentation:hover .presentation-controls{
    opacity:1;
}

.presentation-controls button{
    min-width:34px;
    height:30px;
    border:0;
    border-radius:5px;
    background:#222;
    color:white;
}

.presentation-controls button:hover{
    background:#444;
}

.presentation-counter{
    position:absolute;
    right:15px;
    bottom:18px;
    color:white;
    font-size:12px;
    background:rgba(0,0,0,.55);
    padding:5px 8px;
    border-radius:5px;
}

/* =========================================================
   DARK MODE
========================================================= */

body.dark{
    --bg:#111827;
    --panel:#171b24;
    --panel2:#202631;
    --border:#303744;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --toolbar:#171b24;
    --canvas:#0f172a;
    --shadow:0 8px 25px rgba(0,0,0,.4);
}

body.dark .thumbnail-frame{
    box-shadow:0 2px 5px rgba(0,0,0,.4);
}

body.dark .inspector-action:hover{
    background:#303744;
}

/* =========================================================
   PRINT
========================================================= */

@media print{
    body *{
        visibility:hidden!important;
    }

    .print-slide,
    .print-slide *{
        visibility:visible!important;
    }

    .print-slide{
        position:absolute!important;
        left:0!important;
        top:0!important;
        width:100vw!important;
        height:56.25vw!important;
        box-shadow:none!important;
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:950px){
    .left-panel{
        width:180px;
    }

    .right-panel{
        width:235px;
    }

    .brand{
        min-width:135px;
    }
}

@media(max-width:720px){
    .left-panel{
        display:none;
    }

    .right-panel{
        display:none;
    }

    .canvas-scroll{
        padding:20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <div class="brand">
            <div class="brand-icon">S</div>
            <div class="brand-name">A-Zpace</div>
        </div>

        <input
            id="presentationName"
            class="file-name"
            value="Untitled Presentation"
            spellcheck="false"
            title="Presentation name"
        >

        <div class="top-actions">

            <button
                class="icon-btn"
                type="button"
                onclick="returnToWorkspace()"
                title="Return to A-Zpace"
            >
                ← Workspace
            </button>

            <button class="icon-btn" id="undoBtn" title="Undo">
                ↶
            </button>

            <button class="icon-btn" id="redoBtn" title="Redo">
                ↷
            </button>

            <button class="icon-btn" id="saveBtn" title="Save">
                💾
            </button>

            <button class="icon-btn" id="themeBtn" title="Toggle theme">
                ◐
            </button>

            <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
                ⛶
            </button>

            <button class="primary-btn" id="presentBtn">
                Present
            </button>

        </div>

    </div>

    <!-- =====================================================
         MENUBAR
    ====================================================== -->

    <div class="menubar">

        <div class="menu">
            <button data-menu="file">File</button>

            <div class="dropdown" id="menu-file">

                <button data-action="new">
                    <span>New presentation</span>
                    <span class="shortcut">Ctrl+N</span>
                </button>

                <button data-action="open-json">
                    <span>Open presentation (.pptx or .slides.json)</span>
                    <span class="shortcut">Ctrl+O</span>
                </button>

                <button data-action="templates">
                    <span>New from template</span>
                </button>

                <button data-action="save">
                    <span>Save</span>
                    <span class="shortcut">Ctrl+S</span>
                </button>

                <div class="separator"></div>

                <button data-action="export-json">
                    <span>Export editable backup (.slides.json)</span>
                </button>

                <button data-action="export-pptx" data-azpace-pro="slides_pptx_export">
                    <span>Download PowerPoint (.pptx)</span>
                </button>

                <button data-action="export-png" data-azpace-pro="slides_png_export">
                    <span>Export current slide PNG</span>
                </button>

                <button data-action="print">
                    <span>Print slides</span>
                    <span class="shortcut">Ctrl+P</span>
                </button>

                <div class="separator"></div>

                <button data-action="rename">

<!-- =========================================================

========================================================== -->

<div class="presentation" id="presentation">

    <div
        class="presentation-slide"
        id="presentationSlide"
    ></div>

    <div class="presentation-controls">

        <button id="presentationPrev">‹</button>
        <button id="presentationNext">›</button>

    </div>

        class="presentation-counter"
        id="presentationCounter"
    >
        1 / 1

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   STORAGE / CONSTANTS
========================================================= */

const STORAGE_KEY = "dw-slides-document-v1";

const SLIDE_WIDTH = 960;
const SLIDE_HEIGHT = 540;

let state = {
    name: "Untitled Presentation",

    width: SLIDE_WIDTH,
    height: SLIDE_HEIGHT,

    theme: "light",

    slides: [],

    activeSlide: 0,

    zoom: 100,

    showGrid: false,

    showGuides: true
};

let selectedIds = [];

let clipboard = null;

let undoStack = [];
let redoStack = [];

let dragging = null;
let resizing = null;
let rotating = null;

let presentationIndex = 0;

let modalCallback = null;

let thumbnailDragIndex = null;


/* =========================================================
   ID
========================================================= */

function uid(prefix = "id"){
    return prefix + "_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2,9);
}


/* =========================================================
   DEFAULT SLIDE
========================================================= */

function createSlide(layout = "title-content"){

    const slide = {
        id:uid("slide"),

        name:`Slide ${state.slides.length + 1}`,

        background:{
            type:"solid",
            color:"#ffffff"
        },

        notes:"",

        transition:"none",

        elements:[]
    };

    if(layout === "title"){

        slide.elements.push(
            createTextElement(
                100,
                165,
                760,
                95,
                "Click to add title",
                {
                    fontSize:44,
                    fontWeight:"700",
                    align:"center"
                }
            )
        );

        slide.elements.push(
            createTextElement(
                180,
                280,
                600,
                70,
                "Click to add subtitle",
                {
                    fontSize:24,
                    color:"#555555",
                    align:"center"
                }
            )
        );
    }

    else if(layout === "title-content"){

        slide.elements.push(
            createTextElement(
                70,
                55,
                820,
                70,
                "Click to add title",
                {
                    fontSize:36,
                    fontWeight:"700"
                }
            )
        );

        slide.elements.push(
            createTextElement(
                90,
                155,
                780,
                260,
                "Click to add content",
                {
                    fontSize:24,
                    color:"#444444"
                }
            )
        );
    }

    return slide;
}


/* =========================================================
   ELEMENT FACTORIES
========================================================= */

function baseElement(type,x,y,w,h){

    return {
        id:uid("el"),

        type,

        x,
        y,
        w,
        h,

        rotation:0,

        opacity:1,

        z:0,

        locked:false,

        groupId:null
    };
}


function createTextElement(
    x,
    y,
    w,
    h,
    text,
    options={}
){

    return Object.assign(
        baseElement("text",x,y,w,h),
        {
            text,

            fontFamily:options.fontFamily || "Arial",

            fontSize:options.fontSize || 24,

            fontWeight:options.fontWeight || "400",

            fontStyle:options.fontStyle || "normal",

            textDecoration:options.textDecoration || "none",

            color:options.color || "#111111",

            background:options.background || "transparent",

            align:options.align || "left",

            verticalAlign:options.verticalAlign || "top",

            lineHeight:options.lineHeight || 1.2,

            padding:options.padding ?? 5
        }
    );
}


function createShapeElement(
    x,
    y,
    w,
    h,
    shape="rectangle"
){

    return Object.assign(
        baseElement("shape",x,y,w,h),
        {
            shape,

            fill:"#3b82f6",

            stroke:"#1e40af",

            strokeWidth:2,

            radius:10
        }
    );
}


function createLineElement(
    x,
    y,
    w,
    h,
    arrow=false
){

    return Object.assign(
        baseElement("line",x,y,w,h),
        {
            stroke:"#111111",

            strokeWidth:3,

            arrow,

            startArrow:false,

            endArrow:arrow
        }
    );
}


function createImageElement(
    x,
    y,
    w,
    h,
    src
){

    return Object.assign(
        baseElement("image",x,y,w,h),
        {
            src,

            objectFit:"fill",

            borderRadius:0
        }
    );
}


function createTableElement(
    x,
    y,
    w,
    h,
    rows=3,
    cols=3
){

    const data=[];

    for(let r=0;r<rows;r++){

        const row=[];

        for(let c=0;c<cols;c++){

            row.push(
                r === 0
                    ? `Header ${c+1}`
                    : `Cell ${r},${c+1}`
            );
        }

        data.push(row);
    }

    return Object.assign(
        baseElement("table",x,y,w,h),
        {
            rows,
            cols,
            data,

            headerFill:"#2563eb",

            headerColor:"#ffffff",

            cellFill:"#ffffff",

            borderColor:"#94a3b8",

            fontSize:16
        }
    );
}


/* =========================================================
   ACTIVE SLIDE
========================================================= */

function getSlide(){

    return state.slides[state.activeSlide];
}


function getElement(id){

    return getSlide()?.elements.find(
        e=>e.id===id
    );
}


/* =========================================================
   HISTORY
========================================================= */

function snapshot(){

    return JSON.stringify(state);
}


function pushHistory(){

    undoStack.push(snapshot());

    if(undoStack.length > 80){
        undoStack.shift();
    }

    redoStack=[];
}


function undo(){

    if(!undoStack.length){
        toast("Nothing to undo");
        return;
    }

    redoStack.push(snapshot());

    state = JSON.parse(
        undoStack.pop()
    );

    selectedIds=[];

    renderAll();
    save();
}


function redo(){

    if(!redoStack.length){
        toast("Nothing to redo");
        return;
    }

    undoStack.push(snapshot());

    state = JSON.parse(
        redoStack.pop()
    );

    selectedIds=[];

    renderAll();
    save();
}


/* =========================================================
   SAVE / LOAD
========================================================= */

function save(){

    state.name =
        document.getElementById(
            "presentationName"
        ).value || "Untitled Presentation";

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

    registerWorkspaceRecent();
}


function registerWorkspaceRecent(){

    try{

        const key="dw-real-recent-files";
        const saved=JSON.parse(
            localStorage.getItem(key)||"[]"
        );
        const files=Array.isArray(saved)?saved:[];
        const recent={
            id:"slides",
            name:state.name||"Untitled Presentation",
            type:"presentation",
            url:"ppt.html",
            timestamp:Date.now()
        };

        localStorage.setItem(
            key,
            JSON.stringify([
                recent,
                ...files.filter(
                    item=>item.id!=="slides" &&
                        !(item.type==="presentation" &&
                          item.url==="ppt.html")
                )
            ].slice(0,30))
        );

    }catch(err){

        console.error(
            "Could not register Slides presentation in workspace recents:",
            err
        );
    }
}


function returnToWorkspace(){
    save();
    window.location.href="index.html";
}


function load(){

    try{

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if(raw){

            const loaded =
                JSON.parse(raw);

            if(
                loaded &&
                Array.isArray(loaded.slides)
            ){

                state = Object.assign(
                    state,
                    loaded
                );
            }
        }

    }catch(err){

        console.error(err);

    }

    if(!state.slides.length){

        state.slides.push(
            createSlide("title")
        );

        state.slides.push(
            createSlide("title-content")
        );
    }

    document.getElementById(
        "presentationName"
    ).value = state.name;

    applyTheme();

    save();
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent=message;

    el.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        el.classList.remove("show");
    },1800);
}


/* =========================================================
   THEME
========================================================= */

function applyTheme(){

    document.body.classList.toggle(
        "dark",
        state.theme==="dark"
    );
}


function toggleTheme(){

    pushHistory();

    state.theme =
        state.theme==="dark"
            ? "light"
            : "dark";

    applyTheme();

    save();
}


/* =========================================================
   SLIDE MANAGEMENT
========================================================= */

function addSlide(layout="title-content"){

    pushHistory();

    const slide =
        createSlide(layout);

    state.slides.splice(
        state.activeSlide + 1,
        0,
        slide
    );

    state.activeSlide++;

    selectedIds=[];

    renderAll();
    save();
}


function duplicateSlide(){

    const source =
        getSlide();

    if(!source) return;

    pushHistory();

    const clone =
        JSON.parse(
            JSON.stringify(source)
        );

    clone.id=uid("slide");

    clone.name =
        `${source.name} Copy`;

    clone.elements.forEach(
        e=>{
            e.id=uid("el");
        }
    );

    state.slides.splice(
        state.activeSlide + 1,
        0,
        clone
    );

    state.activeSlide++;

    selectedIds=[];

    renderAll();
    save();
}


function deleteSlide(){

    if(state.slides.length<=1){

        toast("A presentation needs at least one slide");

        return;
    }

    pushHistory();

    state.slides.splice(
        state.activeSlide,
        1
    );

    state.activeSlide =
        Math.max(
            0,
            Math.min(
                state.activeSlide,
                state.slides.length-1
            )
        );

    selectedIds=[];

    renderAll();
    save();
}


function renameSlide(){

    const slide=getSlide();

    if(!slide) return;

    showPrompt(
        "Rename slide",
        "Slide name",
        slide.name,
        value=>{

            if(!value) return;

            pushHistory();

            slide.name=value;

            renderAll();
            save();
        }
    );
}


/* =========================================================
   SLIDE BACKGROUND
========================================================= */

function setSlideBackground(color){

    const slide=getSlide();

    if(!slide) return;

    pushHistory();

    slide.background={
        type:"solid",
        color
    };

    renderAll();
    save();
}


/* =========================================================
   RENDER THUMBNAILS
========================================================= */

function renderThumbnails(){

    const container =
        document.getElementById(
            "thumbnails"
        );

    const query =
        document.getElementById(
            "slideSearch"
        ).value.toLowerCase();

    container.innerHTML="";

    state.slides.forEach(
        (slide,index)=>{

            if(
                query &&
                !slide.name.toLowerCase().includes(query)
            ){
                return;
            }

            const item =
                document.createElement("div");

            item.className =
                "thumbnail" +
                (index===state.activeSlide
                    ? " active"
                    : "");

            item.draggable=true;

            item.dataset.index=index;

            const number =
                document.createElement("div");

            number.className=
                "thumbnail-number";

            number.textContent=index+1;

            const frame =
                document.createElement("div");

            frame.className=
                "thumbnail-frame";

            frame.innerHTML =
                renderSlideStaticHTML(
                    slide,
                    true
                );

            const title =
                document.createElement("div");

            title.className=
                "thumbnail-title";

            title.textContent=slide.name;

            item.appendChild(number);
            item.appendChild(frame);
            item.appendChild(title);

            item.addEventListener(
                "click",
                ()=>{
                    state.activeSlide=index;
                    selectedIds=[];
                    renderAll();
                }
            );

            item.addEventListener(
                "dblclick",
                ()=>{
                    renameSlide();
                }
            );

            item.addEventListener(
                "dragstart",
                ()=>{
                    thumbnailDragIndex=index;
                    item.classList.add("dragging");
                }
            );

            item.addEventListener(
                "dragend",
                ()=>{
                    item.classList.remove("dragging");
                }
            );

            item.addEventListener(
                "dragover",
                e=>{
                    e.preventDefault();
                }
            );

            item.addEventListener(
                "drop",
                e=>{

                    e.preventDefault();

                    if(
                        thumbnailDragIndex===null ||
                        thumbnailDragIndex===index
                    ){
                        return;
                    }

                    pushHistory();

                    const moved =
                        state.slides.splice(
                            thumbnailDragIndex,
                            1
                        )[0];

                    state.slides.splice(
                        index,
                        0,
                        moved
                    );

                    state.activeSlide=index;

                    thumbnailDragIndex=null;

                    renderAll();
                    save();
                }
            );

            item.addEventListener(
                "contextmenu",
                e=>{

                    e.preventDefault();

                    showContextMenu(
                        e.clientX,
                        e.clientY,
                        "slide"
                    );
                }
            );

            container.appendChild(item);
        }
    );
}


/* =========================================================
   STATIC SLIDE RENDER
========================================================= */

function renderSlideStaticHTML(
    slide,
    thumbnail=false
){

    const scale =
        thumbnail
            ? 0.25
            : 1;

    let html="";

    const bg =
        slide.background?.color ||
        "#ffffff";

    html += `
        <div
            style="
                position:absolute;
                inset:0;
                background:${escapeAttr(bg)};
                overflow:hidden;
            "
        >
    `;

    const sorted =
        [...slide.elements]
            .sort((a,b)=>
                (a.z||0)-(b.z||0)
            );

    sorted.forEach(el=>{

        html +=
            elementHTML(
                el,
                scale,
                true
            );
    });

    html += "</div>";

    return html;
}


/* =========================================================
   ELEMENT HTML
========================================================= */

function elementHTML(
    el,
    scale=1,
    staticMode=false
){

    const left=el.x*scale;
    const top=el.y*scale;
    const width=el.w*scale;
    const height=el.h*scale;

    const transform =
        `rotate(${el.rotation||0}deg)`;

    const opacity =
        el.opacity ?? 1;

    const common =
        `
        position:absolute;
        left:${left}px;
        top:${top}px;
        width:${width}px;
        height:${height}px;
        transform:${transform};
        opacity:${opacity};
        z-index:${el.z||0};
        `;

    if(el.type==="text"){

        return `
        <div
            style="
                ${common}
                padding:${(el.padding||0)*scale}px;
                color:${escapeAttr(el.color)};
                background:${escapeAttr(el.background)};
                font-family:${escapeAttr(el.fontFamily)};
                font-size:${el.fontSize*scale}px;
                font-weight:${escapeAttr(el.fontWeight)};
                font-style:${escapeAttr(el.fontStyle)};
                text-decoration:${escapeAttr(el.textDecoration)};
                text-align:${escapeAttr(el.align)};
                line-height:${el.lineHeight};
                white-space:pre-wrap;
                overflow:hidden;
                box-sizing:border-box;
            "
        >${escapeHTML(el.text)}</div>
        `;
    }

    if(el.type==="shape"){

        return `
        <div
            style="
                ${common}
                background:${escapeAttr(el.fill)};
                border:${el.strokeWidth}px solid ${escapeAttr(el.stroke)};
                border-radius:${shapeRadius(el)}px;
                box-sizing:border-box;
            "
        ></div>
        `;
    }

    if(el.type==="image"){

        return `
        <img
            src="${escapeAttr(el.src)}"
            style="
                ${common}
                object-fit:${escapeAttr(el.objectFit||"fill")};
                border-radius:${el.borderRadius||0}px;
            "
        >
        `;
    }

    if(el.type==="line"){

        const x1=0;
        const y1=el.h/2;
        const x2=el.w;
        const y2=el.h/2;

        return `
        <svg
            style="${common}"
            viewBox="0 0 ${Math.max(1,el.w)} ${Math.max(1,el.h)}"
            preserveAspectRatio="none"
        >
            <defs>
                <marker
                    id="arrow-${el.id}-${staticMode?'s':'d'}"
                    markerWidth="10"
                    markerHeight="10"
                    refX="8"
                    refY="3"
                    orient="auto"
                >
                    <path
                        d="M0,0 L0,6 L9,3 z"
                        fill="${escapeAttr(el.stroke)}"
                    ></path>
                </marker>
            </defs>

            <line
                x1="${x1}"
                y1="${y1}"
                x2="${x2}"
                y2="${y2}"
                stroke="${escapeAttr(el.stroke)}"
                stroke-width="${el.strokeWidth}"
                ${el.endArrow
                    ? `marker-end="url(#arrow-${el.id}-${staticMode?'s':'d'})"`
                    : ""}
            ></line>
        </svg>
        `;
    }

    if(el.type==="table"){

        let table=`
        <table
            style="
                ${common}
                border-collapse:collapse;
                table-layout:fixed;
                font-size:${el.fontSize*scale}px;
            "
        >`;

        for(let r=0;r<el.rows;r++){

            table+="<tr>";

            for(let c=0;c<el.cols;c++){

                const header=r===0;

                table+=`
                <td
                    style="
                        border:1px solid ${escapeAttr(el.borderColor)};
                        padding:${5*scale}px;
                        background:${escapeAttr(
                            header
                                ? el.headerFill
                                : el.cellFill
                        )};
                        color:${escapeAttr(
                            header
                                ? el.headerColor
                                : "#111111"
                        )};
                    "
                >
                    ${escapeHTML(
                        el.data?.[r]?.[c] ?? ""
                    )}
                </td>
                `;
            }

            table+="</tr>";
        }

        table+="</table>";

        return table;
    }

    return "";
}


/* =========================================================
   SHAPE RADIUS
========================================================= */

function shapeRadius(el){

    if(el.shape==="circle"){
        return "50%";
    }

    if(el.shape==="pill"){
        return Math.min(el.w,el.h)/2;
    }

    if(el.shape==="rounded"){
        return el.radius || 15;
    }

    if(el.shape==="diamond"){
        return "0";
    }

    return 0;
}


/* =========================================================
   RENDER MAIN SLIDE
========================================================= */

function renderCanvas(){

    const slide=getSlide();

    if(!slide) return;

    const stage =
        document.getElementById(
            "slideStage"
        );

    stage.style.width =
        state.width + "px";

    stage.style.height =
        state.height + "px";

    const canvas =
        document.getElementById(
            "slideCanvas"
        );

    canvas.innerHTML="";

    canvas.style.background =
        slide.background?.color ||
        "#ffffff";

    const sorted =
        [...slide.elements]
            .sort((a,b)=>
                (a.z||0)-(b.z||0)
            );

    sorted.forEach(
        el=>{
            renderElement(
                canvas,
                el
            );
        }
    );

    document.getElementById(
        "gridOverlay"
    ).classList.toggle(
        "visible",
        state.showGrid
    );

    document.getElementById(
        "guides"
    ).style.display =
        state.showGuides
            ? "block"
            : "none";

    applyZoom();
}


/* =========================================================
   RENDER ELEMENT
========================================================= */

function renderElement(
    canvas,
    el
){

    const wrapper =
        document.createElement("div");

    wrapper.className="element";

    wrapper.dataset.id=el.id;

    wrapper.style.left=el.x+"px";
    wrapper.style.top=el.y+"px";

    wrapper.style.width=el.w+"px";
    wrapper.style.height=el.h+"px";

    wrapper.style.transform =
        `rotate(${el.rotation||0}deg)`;

    wrapper.style.opacity =
        el.opacity ?? 1;

    wrapper.style.zIndex =
        el.z||0;

    if(selectedIds.includes(el.id)){

        wrapper.classList.add(
            selectedIds.length>1
                ? "multi-selected"
                : "selected"
        );
    }

    const content =
        document.createElement("div");

    content.className="element-content";

    if(el.type==="text"){

        content.classList.add(
            "text-element"
        );

        content.textContent=el.text;

        content.style.padding =
            `${el.padding||0}px`;

        content.style.color=el.color;

        content.style.background=
            el.background;

        content.style.fontFamily=
            el.fontFamily;

        content.style.fontSize=
            el.fontSize+"px";

        content.style.fontWeight=
            el.fontWeight;

        content.style.fontStyle=
            el.fontStyle;

        content.style.textDecoration=
            el.textDecoration;

        content.style.textAlign=
            el.align;

        content.style.lineHeight=
            el.lineHeight;

        content.style.boxSizing=
            "border-box";
    }

    else if(el.type==="shape"){

        content.classList.add(
            "shape-element"
        );

        content.style.background=
            el.fill;

        content.style.border=
            `${el.strokeWidth}px solid ${el.stroke}`;

        if(el.shape==="circle"){
            content.style.borderRadius="50%";
        }

        else if(el.shape==="pill"){
            content.style.borderRadius=
                Math.min(el.w,el.h)/2+"px";
        }

        else if(el.shape==="rounded"){
            content.style.borderRadius=
                (el.radius||15)+"px";
        }

        else if(el.shape==="diamond"){

            content.style.transform=
                "rotate(45deg) scale(.72)";

        }
    }

    else if(el.type==="image"){

        const image=
            document.createElement("img");

        image.className="image-element";

        image.src=el.src;

        image.style.objectFit=
            el.objectFit || "fill";

        image.style.borderRadius=
            (el.borderRadius||0)+"px";

        content.appendChild(image);
    }

    else if(el.type==="line"){

        content.innerHTML=`
            <svg
                class="line-element"
                viewBox="0 0 ${Math.max(1,el.w)} ${Math.max(1,el.h)}"
                preserveAspectRatio="none"
            >
                <defs>
                    <marker
                        id="arrow-${el.id}"
                        markerWidth="10"
                        markerHeight="10"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <path
                            d="M0,0 L0,6 L9,3 z"
                            fill="${escapeAttr(el.stroke)}"
                        ></path>
                    </marker>
                </defs>

                <line
                    x1="0"
                    y1="${el.h/2}"
                    x2="${el.w}"
                    y2="${el.h/2}"
                    stroke="${escapeAttr(el.stroke)}"
                    stroke-width="${el.strokeWidth}"
                    ${
                        el.endArrow
                        ? `marker-end="url(#arrow-${el.id})"`
                        : ""
                    }
                />
            </svg>
        `;
    }

    else if(el.type==="table"){

        content.innerHTML =
            tableHTML(el);
    }

    wrapper.appendChild(content);

    if(selectedIds.includes(el.id)){

        addSelectionHandles(wrapper);
    }

    wrapper.addEventListener(
        "mousedown",
        e=>{

            if(e.button!==0) return;

            e.stopPropagation();

            handleElementMouseDown(
                e,
                el
            );
        }
    );

    wrapper.addEventListener(
        "dblclick",
        e=>{

            e.stopPropagation();

            if(el.type==="text"){
                startTextEditing(el);
            }

            else if(el.type==="table"){
                editTable(el);
            }
        }
    );

    wrapper.addEventListener(
        "contextmenu",
        e=>{

            e.preventDefault();

            if(!selectedIds.includes(el.id)){

                selectedIds=[el.id];

                renderCanvas();
                renderInspector();
            }

            showContextMenu(
                e.clientX,
                e.clientY,
                "element"
            );
        }
    );

    canvas.appendChild(wrapper);
}


/* =========================================================
   TABLE HTML
========================================================= */

function tableHTML(el){

    let html=`
        <table
            style="
                width:100%;
                height:100%;
                border-collapse:collapse;
                table-layout:fixed;
                font-size:${el.fontSize}px;
            "
        >
    `;

    for(let r=0;r<el.rows;r++){

        html+="<tr>";

        for(let c=0;c<el.cols;c++){

            const isHeader=r===0;

            html+=`
                <td
                    style="
                        border:1px solid ${escapeAttr(el.borderColor)};
                        padding:6px;
                        background:${escapeAttr(
                            isHeader
                                ? el.headerFill
                                : el.cellFill
                        )};
                        color:${escapeAttr(
                            isHeader
                                ? el.headerColor
                                : "#111111"
                        )};
                        overflow:hidden;
                    "
                >
                    ${escapeHTML(
                        el.data?.[r]?.[c] ?? ""
                    )}
                </td>
            `;
        }

        html+="</tr>";
    }

    html+="</table>";

    return html;
}


/* =========================================================
   SELECTION HANDLES
========================================================= */

function addSelectionHandles(wrapper){

    [
        "nw","n","ne",
        "e","se","s",
        "sw","w"
    ].forEach(pos=>{

        const handle=
            document.createElement("div");

        handle.className=
            `selection-handle handle-${pos}`;

        handle.dataset.handle=pos;

        handle.addEventListener(
            "mousedown",
            e=>{

                e.stopPropagation();

                const el=
                    getElement(
                        wrapper.dataset.id
                    );

                if(el){

                    resizing={
                        id:el.id,
                        handle:pos,
                        startX:e.clientX,
                        startY:e.clientY,
                        x:el.x,
                        y:el.y,
                        w:el.w,
                        h:el.h
                    };
                }
            }
        );

        wrapper.appendChild(handle);
    });

    const line=
        document.createElement("div");

    line.className="rotation-line";

    wrapper.appendChild(line);

    const rotate=
        document.createElement("div");

    rotate.className="rotation-handle";

    rotate.addEventListener(
        "mousedown",
        e=>{

            e.stopPropagation();

            const el=
                getElement(
                    wrapper.dataset.id
                );

            if(!el) return;

            rotating={
                id:el.id,
                startX:e.clientX,
                startY:e.clientY,
                rotation:el.rotation||0
            };
        }
    );

    wrapper.appendChild(rotate);
}


/* =========================================================
   ELEMENT MOUSE DOWN
========================================================= */

function handleElementMouseDown(
    e,
    el
){

    if(el.locked){
        toast("This element is locked");
        return;
    }

    if(e.shiftKey){

        if(selectedIds.includes(el.id)){

            selectedIds =
                selectedIds.filter(
                    id=>id!==el.id
                );

        }else{

            selectedIds.push(el.id);
        }

    }else{

        if(!selectedIds.includes(el.id)){

            selectedIds=[el.id];
        }
    }

    renderCanvas();
    renderInspector();

    dragging={
        ids:[...selectedIds],

        startX:e.clientX,
        startY:e.clientY,

        positions:selectedIds.map(
            id=>{

                const item=getElement(id);

                return {
                    id,
                    x:item.x,
                    y:item.y
                };
            }
        )
    };
}


/* =========================================================
   GLOBAL MOUSE MOVE
========================================================= */

document.addEventListener(
    "mousemove",
    e=>{

        if(dragging){

            const dx=e.clientX-dragging.startX;
            const dy=e.clientY-dragging.startY;

            const scale =
                state.zoom/100;

            dragging.positions.forEach(
                pos=>{

                    const el=
                        getElement(pos.id);

                    if(!el) return;

                    el.x=
                        Math.round(
                            pos.x + dx/scale
                        );

                    el.y=
                        Math.round(
                            pos.y + dy/scale
                        );

                    snapElement(el);
                }
            );

            renderCanvas();
        }

        if(resizing){

            const dx =
                (e.clientX-resizing.startX) /
                (state.zoom/100);

            const dy =
                (e.clientY-resizing.startY) /
                (state.zoom/100);

            const el =
                getElement(
                    resizing.id
                );

            if(!el) return;

            const h=resizing.handle;

            if(h.includes("e")){
                el.w=Math.max(
                    20,
                    resizing.w+dx
                );
            }

            if(h.includes("s")){
                el.h=Math.max(
                    20,
                    resizing.h+dy
                );
            }

            if(h.includes("w")){

                const newW=
                    Math.max(
                        20,
                        resizing.w-dx
                    );

                el.x=
                    resizing.x+
                    (resizing.w-newW);

                el.w=newW;
            }

            if(h.includes("n")){

                const newH=
                    Math.max(
                        20,
                        resizing.h-dy
                    );

                el.y=
                    resizing.y+
                    (resizing.h-newH);

                el.h=newH;
            }

            renderCanvas();
        }

        if(rotating){

            const el=
                getElement(
                    rotating.id
                );

            if(!el) return;

            const stage=
                document.getElementById(
                    "slideStage"
                );

            const rect=
                stage.getBoundingClientRect();

            const cx=
                rect.left+
                (el.x+el.w/2)*
                state.zoom/100;

            const cy=
                rect.top+
                (el.y+el.h/2)*
                state.zoom/100;

            const angle=
                Math.atan2(
                    e.clientY-cy,
                    e.clientX-cx
                ) *
                180/Math.PI;

            el.rotation=
                Math.round(
                    angle+90
                );

            renderCanvas();
        }
    }
);


/* =========================================================
   GLOBAL MOUSE UP
========================================================= */

document.addEventListener(
    "mouseup",
    ()=>{

        if(
            dragging ||
            resizing ||
            rotating
        ){

            pushHistoryAfterInteraction();
        }

        dragging=null;
        resizing=null;
        rotating=null;
    }
);


function pushHistoryAfterInteraction(){

    if(!undoStack.length){
        undoStack.push(snapshot());
    }

    save();
}


/* =========================================================
   SNAP
========================================================= */

function snapElement(el){

    const threshold=7;

    if(Math.abs(el.x)<threshold){
        el.x=0;
    }

    if(
        Math.abs(
            el.x+el.w-state.width
        )<threshold
    ){

        el.x=
            state.width-el.w;
    }

    if(Math.abs(el.y)<threshold){
        el.y=0;
    }

    if(
        Math.abs(
            el.y+el.h-state.height
        )<threshold
    ){

        el.y=
            state.height-el.h;
    }

    const centerX=
        state.width/2-el.w/2;

    const centerY=
        state.height/2-el.h/2;

    if(
        Math.abs(el.x-centerX)
        < threshold
    ){

        el.x=centerX;
    }

    if(
        Math.abs(el.y-centerY)
        < threshold
    ){

        el.y=centerY;
    }
}


/* =========================================================
   TEXT EDITING
========================================================= */

function startTextEditing(el){

    const canvas=
        document.getElementById(
            "slideCanvas"
        );

    const editor=
        document.createElement(
            "textarea"
        );

    editor.value=el.text;

    editor.style.position="absolute";
    editor.style.left=el.x+"px";
    editor.style.top=el.y+"px";
    editor.style.width=el.w+"px";
    editor.style.height=el.h+"px";

    editor.style.zIndex="99999";

    editor.style.padding=
        (el.padding||0)+"px";

    editor.style.fontFamily=
        el.fontFamily;

    editor.style.fontSize=
        el.fontSize+"px";

    editor.style.fontWeight=
        el.fontWeight;

    editor.style.fontStyle=
        el.fontStyle;

    editor.style.color=
        el.color;

    editor.style.background=
        el.background==="transparent"
            ? "rgba(255,255,255,.9)"
            : el.background;

    editor.style.border=
        "2px solid #2563eb";

    editor.style.outline="none";

    editor.style.resize="none";

    canvas.appendChild(editor);

    editor.focus();

    editor.select();

    const finish=()=>{

        if(!editor.isConnected){
            return;
        }

        pushHistory();

        el.text=editor.value;

        editor.remove();

        renderCanvas();
        renderInspector();
        save();
    };

    editor.addEventListener(
        "blur",
        finish,
        {once:true}
    );

    editor.addEventListener(
        "keydown",
        e=>{

            if(
                e.key==="Escape"
            ){

                editor.remove();
                renderCanvas();

            }

            if(
                e.key==="Enter" &&
                e.ctrlKey
            ){

                editor.blur();
            }
        }
    );
}

                <label>Rows</label>
                <input id="tableRows" type="number"
                    min="1" max="20"
                    value="${el.rows}">
            </div>

            <div class="field">
                <label>Columns</label>
                <input id="tableCols" type="number"
                    min="1" max="15"
                    value="${el.cols}">
            </div>
        `,
        ()=>{
            const rows=
                Math.max(
                    1,
                    Math.min(
                        20,
                        Number(
                            document.getElementById(
                                "tableRows"
                            ).value
                        )
                    )
                );

            const cols=
                Math.max(
                    1,
                    Math.min(
                        15,
                        Number(
                            document.getElementById(
                                "tableCols"
                            ).value
                        )
                    )
                );

            pushHistory();

            const data=[];

            for(let r=0;r<rows;r++){

                const row=[];

                for(let c=0;c<cols;c++){

                    row.push(
                        el.data?.[r]?.[c] ??
                        (
                            r===0
                                ? `Header ${c+1}`
                                : `Cell ${r+1},${c+1}`
                        )
                    );
                }

                data.push(row);
            }

            el.rows=rows;
            el.cols=cols;
            el.data=data;

            renderAll();
            save();
        }
    );
}


/* =========================================================
   Z INDEX
========================================================= */

function nextZ(){

    const elements=getSlide().elements;

    return elements.reduce(
        (max,e)=>
            Math.max(
                max,
                Number(e.z)||0
            ),
        0
    )+1;
}


function bringFront(){

    if(!selectedIds.length) return;

    pushHistory();

    const max=nextZ();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=max++;
            }
        }
    );

    renderAll();
    save();
}


function bringForward(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=(el.z||0)+1;
            }
        }
    );

    renderAll();
    save();
}


function sendBackward(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=Math.max(
                    0,
                    (el.z||0)-1
                );
            }
        }
    );

    renderAll();
    save();
}


function sendBack(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{
            const el=getElement(id);

            if(el){
                el.z=0;
            }
        }
    );

    renderAll();
    save();
}


/* =========================================================
   DELETE
========================================================= */

function deleteSelected(){

    if(!selectedIds.length) return;

    pushHistory();

    const slide=getSlide();

    slide.elements=
        slide.elements.filter(
            e=>!selectedIds.includes(e.id)
        );

    selectedIds=[];

    renderAll();
    save();
}


/* =========================================================
   COPY / CUT / PASTE
========================================================= */

function copySelected(){

    if(!selectedIds.length){
        toast("Nothing selected");
        return;
    }

    const elements=
        selectedIds
            .map(id=>getElement(id))
            .filter(Boolean);

    clipboard=
        JSON.parse(
            JSON.stringify(elements)
        );

    toast(
        `${elements.length} element(s) copied`
    );
}


function cutSelected(){

    if(!selectedIds.length){
        toast("Nothing selected");
        return;
    }

    copySelected();

    deleteSelected();

    toast("Cut");
}


function pasteSelected(){

    if(!clipboard?.length){
        toast("Clipboard is empty");
        return;
    }

    pushHistory();

    const pasted=[];

    clipboard.forEach(
        original=>{

            const el=
                JSON.parse(
                    JSON.stringify(original)
                );

            el.id=uid("el");

            el.x+=25;
            el.y+=25;

            el.z=nextZ();

            getSlide().elements.push(el);

            pasted.push(el.id);
        }
    );

    selectedIds=pasted;

    renderAll();
    save();

    toast("Pasted");
}


/* =========================================================
   GROUP / UNGROUP
========================================================= */

function groupSelected(){

    if(selectedIds.length<2){

        toast("Select at least two elements");

        return;
    }

    pushHistory();

    const groupId=uid("group");

    selectedIds.forEach(
        id=>{

            const el=getElement(id);

            if(el){
                el.groupId=groupId;
            }
        }
    );

    toast("Grouped");
    renderAll();
    save();
}


function ungroupSelected(){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{

            const el=getElement(id);

            if(el){
                el.groupId=null;
            }
        }
    );

    toast("Ungrouped");

    renderAll();
    save();
}


/* =========================================================
   ALIGN
========================================================= */

function alignElements(type){

    if(selectedIds.length<2){

        toast("Select multiple elements");

        return;
    }

    pushHistory();

    const elements=
        selectedIds
            .map(id=>getElement(id))
            .filter(Boolean);

    if(type==="left"){

        const x=
            Math.min(
                ...elements.map(e=>e.x)
            );

        elements.forEach(
            e=>e.x=x
        );
    }

    if(type==="center"){

        const minX=
            Math.min(
                ...elements.map(e=>e.x)
            );

        const maxRight=
            Math.max(
                ...elements.map(
                    e=>e.x+e.w
                )
            );

        const center=
            (minX+maxRight)/2;

        elements.forEach(
            e=>{
                e.x=
                    center-e.w/2;
            }
        );
    }

    if(type==="right"){

        const right=
            Math.max(
                ...elements.map(
                    e=>e.x+e.w
                )
            );

        elements.forEach(
            e=>{
                e.x=right-e.w;
            }
        );
    }

    renderAll();
    save();
}

========================================================= */

function modifyTextProperty(
    property,
    value
){

    if(!selectedIds.length) return;

    pushHistory();

    selectedIds.forEach(
        id=>{

            const el=getElement(id);

            if(!el || el.type!=="text"){
                return;
            }

            el[property]=value;
        }
    );

    renderAll();
    save();
}

}

function renderInspector(){

        );

    if(!slide){

        panel.innerHTML="";

        return;
    }

    if(selectedIds.length===1){

        const el=
            getElement(

            );

        if(el){

            renderElementInspector(
                panel,
                el
            );

            return;
        }
    }

    renderSlideInspector(

        slide
    );
}

    el.addEventListener(

                e.target.value
            );

            save();
        }

    el.addEventListener(

        e=>{

            );

            save();
        }
    );

/* =========================================================
   SLIDE SIZE
========================================================= */

function setSlideSize(
    widthRatio,
    heightRatio
){

    pushHistory();

    const newWidth=960;

    const newHeight=
        Math.round(
            newWidth *
            heightRatio /
            widthRatio
        );

    const oldWidth=state.width;
    const oldHeight=state.height;

    const sx=newWidth/oldWidth;
    const sy=newHeight/oldHeight;

    state.width=newWidth;
    state.height=newHeight;

    state.slides.forEach(
        slide=>{
            slide.elements.forEach(
                el=>{
                    el.x*=sx;
                    el.y*=sy;
                    el.w*=sx;
                    el.h*=sy;
                }
            );
        }
    );

    renderAll();
    save();
}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom(){

    const stage=
        document.getElementById(
            "slideStage"
        );

    const scale=
        state.zoom/100;

    stage.style.transform=
        `scale(${scale})`;

    stage.style.margin=
        `${(state.height*(scale-1))/2}px
         ${(state.width*(scale-1))/2}px`;

    document.getElementById(
        "zoomSlider"
    ).value=state.zoom;

    document.getElementById(
        "zoomLabel"
    ).textContent=
        state.zoom+"%";
}


function setZoom(value){

    state.zoom=
        Math.max(
            25,
            Math.min(
                200,
                Number(value)
            )
        );

    applyZoom();
}


function zoomIn(){

    setZoom(
        state.zoom+10
    );
}


function zoomOut(){

    setZoom(
        state.zoom-10
    );


}


/* =========================================================
   PRESENTATION
========================================================= */

function startPresentation(){

    presentationIndex=
        state.activeSlide;

    renderPresentation();

    document.getElementById(
        "presentation"
    ).classList.add("open");
}


function renderPresentation(){

    const slide=
        state.slides[presentationIndex];

    if(!slide) return;

    const container=
        document.getElementById(
            "presentationSlide"
        );

    const maxWidth=
        window.innerWidth*.94;

    const maxHeight=
        window.innerHeight*.88;

    const scale=
        Math.min(
            maxWidth/state.width,
            maxHeight/state.height
        );

    container.style.width=
        state.width*scale+"px";

    container.style.height=
        state.height*scale+"px";

    container.innerHTML=
        renderSlideStaticHTML(
            slide,
            false
        );

    document.getElementById(
        "presentationCounter"
    ).textContent=
        `${presentationIndex+1} / ${state.slides.length}`;
}


function stopPresentation(){

    document.getElementById(
        "presentation"
    ).classList.remove("open");
}


function nextPresentation(){

    if(
        presentationIndex<
        state.slides.length-1
    ){

        presentationIndex++;

        renderPresentation();
    }
}


function previousPresentation(){

    if(presentationIndex>0){

        presentationIndex--;

        renderPresentation();
    }
}
