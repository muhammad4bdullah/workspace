async function toggleFullscreen(){

    try{

        if(!document.fullscreenElement){

            await document.documentElement
                .requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(err){

        console.error(err);
    }
}


/* =========================================================
   MODAL SYSTEM
========================================================= */

function showModal(
    title,
    body,
    callback
){

    document.getElementById(
        "modalTitle"
    ).textContent=title;

    document.getElementById(
        "modalBody"
    ).innerHTML=body;

    document.getElementById(
        "modalBackdrop"
    ).classList.add("open");

    modalCallback=callback;
}


function closeModal(){

    document.getElementById(
        "modalBackdrop"
    ).classList.remove("open");

    modalCallback=null;
}


document.getElementById(
    "modalClose"
).onclick=closeModal;


document.getElementById(
    "modalCancel"
).onclick=closeModal;


document.getElementById(
    "modalConfirm"
).onclick=()=>{

    if(modalCallback){

        const cb=modalCallback;

        modalCallback=null;

        document.getElementById(
            "modalBackdrop"
        ).classList.remove("open");

        cb();
    }
};


function showPrompt(
    title,
    label,
    value,
    callback
){

    showModal(
        title,
        `
            <div class="field">
                <label>${escapeHTML(label)}</label>

                <input
                    id="modalInput"
                    value="${escapeAttr(value)}"
                    autofocus
                >
            </div>
        `,
        ()=>{
            callback(
                document.getElementById(
                    "modalInput"
                ).value.trim()
            );
        }
    );

    setTimeout(
        ()=>{
            const input=
                document.getElementById(
                    "modalInput"
                );

            input?.focus();
            input?.select();
        },
        20
    );
}


function showConfirm(
    title,
    message,
    callback
){

    showModal(
        title,
        `<p>${escapeHTML(message)}</p>`,
        callback
    );
}


/* =========================================================
   CONTEXT MENU
========================================================= */

function showContextMenu(
    x,
    y,
    type
){

    const menu=
        document.getElementById(
            "contextMenu"
        );

    menu.style.left=x+"px";
    menu.style.top=y+"px";

    menu.dataset.type=type;

    menu.classList.add("open");
}


document.addEventListener(
    "click",
    ()=>{
        document.getElementById(
            "contextMenu"
        ).classList.remove("open");
    }
);


document.querySelectorAll(
    "[data-context]"
).forEach(
    button=>{

        button.addEventListener(
            "click",
            e=>{

                e.stopPropagation();

                const action=
                    button.dataset.context;

                switch(action){

                    case"copy":
                        copySelected();
                        break;

                    case"cut":
                        cutSelected();
                        break;

                    case"duplicate":
                        pasteSelected();
                        break;

                    case"front":
                        bringFront();
                        break;

                    case"back":
                        sendBack();
                        break;

                    case"delete":

                        if(
                            document.getElementById(
                                "contextMenu"
                            ).dataset.type==="slide"
                        ){

                            deleteSlide();

                        }else{

                            deleteSelected();

                        }

                        break;
                }

                document.getElementById(
                    "contextMenu"
                ).classList.remove("open");
            }
        );
    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const tag=
            document.activeElement?.tagName;

        const editingText =
            tag==="INPUT" ||
            tag==="TEXTAREA" ||
            tag==="SELECT";

        const mod=
            e.ctrlKey ||
            e.metaKey;

        if(
            mod &&
            e.key.toLowerCase()==="z"
        ){

            e.preventDefault();

            undo();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="y"
        ){

            e.preventDefault();

            redo();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="s"
        ){

            e.preventDefault();

            save();

            toast("Saved");

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="n"
        ){

            e.preventDefault();

            newPresentation();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="o"
        ){

            e.preventDefault();

            document.getElementById(
                "openInput"
            ).click();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="p"
        ){

            e.preventDefault();

            printSlides();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="c"
        ){

            if(!editingText){

                e.preventDefault();

                copySelected();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="x"
        ){

            if(!editingText){

                e.preventDefault();

                cutSelected();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="v"
        ){

            if(!editingText){

                e.preventDefault();

                pasteSelected();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="a"
        ){

            if(!editingText){

                e.preventDefault();

                selectedIds=
                    getSlide()
                        .elements
                        .map(e=>e.id);

                renderAll();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="b"
        ){

            if(!editingText){

                e.preventDefault();

                toggleBold();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="i"
        ){

            if(!editingText){

                e.preventDefault();

                toggleItalic();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="u"
        ){

            if(!editingText){

                e.preventDefault();

                toggleUnderline();
            }

            return;
        }

        if(e.key==="F5"){

            e.preventDefault();

            startPresentation();

            return;
        }

        if(e.key==="Escape"){

            if(
                document.getElementById(
                    "presentation"
                ).classList.contains("open")
            ){

                stopPresentation();

                return;
            }

            selectedIds=[];

            renderAll();

            return;
        }

        if(editingText){
            return;
        }

        if(e.key==="Delete" ||
           e.key==="Backspace"){

            e.preventDefault();

            deleteSelected();

            return;
        }

        if(e.key==="PageDown"){

            e.preventDefault();

            if(
                state.activeSlide<
                state.slides.length-1
            ){

                state.activeSlide++;

                selectedIds=[];

                renderAll();
            }

            return;
        }

        if(e.key==="PageUp"){

            e.preventDefault();

            if(state.activeSlide>0){

                state.activeSlide--;

                selectedIds=[];

                renderAll();
            }

            return;
        }

        if(
            selectedIds.length &&
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(e.key)
        ){

            e.preventDefault();

            const amount=
                e.shiftKey
                    ? 10
                    : 1;

            pushHistory();

            selectedIds.forEach(
                id=>{

                    const el=getElement(id);

                    if(!el) return;

                    if(e.key==="ArrowUp"){
                        el.y-=amount;
                    }

                    if(e.key==="ArrowDown"){
                        el.y+=amount;
                    }

                    if(e.key==="ArrowLeft"){
                        el.x-=amount;
                    }

                    if(e.key==="ArrowRight"){
                        el.x+=amount;
                    }

                }
            );

            renderAll();
            save();
        }
    }
);


/* =========================================================

========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const presentation=
            document.getElementById(
                "presentation"
            );

            !presentation.classList.contains(
                "open"
            )
        ){
            return;
        }

        if(e.key==="ArrowRight" ||
           e.key==="ArrowDown" ||
           e.key===" " ||
           e.key==="Enter"){

            e.preventDefault();

            nextPresentation();
        }

        else if(
            e.key==="ArrowLeft" ||
            e.key==="ArrowUp"
        ){

            e.preventDefault();

            previousPresentation();
        }
    }
);

/* =========================================================
   DRAG/DROP IMAGE ON CANVAS
========================================================= */

const canvasArea=
    document.getElementById(
        "canvasArea"
    );


document
    .getElementById("slideStage")
    .addEventListener(
        "dragover",
        e=>{
            e.preventDefault();
        }
    );


document
    .getElementById("slideStage")
    .addEventListener(
        "drop",
        e=>{

            e.preventDefault();

            const file=
                e.dataTransfer.files?.[0];

            if(
                file &&
                file.type.startsWith("image/")
            ){

                const reader=
                    new FileReader();

                reader.onload=()=>{

                    pushHistory();

                    const rect=
                        document.getElementById(
                            "slideStage"
                        ).getBoundingClientRect();

                    const scale=
                        state.zoom/100;

                    const x=
                        (e.clientX-rect.left) /
                        scale;

                    const y=
                        (e.clientY-rect.top) /
                        scale;

                    const el=
                        createImageElement(
                            x,
                            y,
                            350,
                            220,
                            reader.result
                        );

                    el.z=nextZ();

                    getSlide()
                        .elements
                        .push(el);

                    selectedIds=[el.id];

                    renderAll();
                    save();
                };

                reader.readAsDataURL(file);
            }
        }
    );


/* =========================================================
   UTILITY: ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttr(value){

    return escapeHTML(value);
}


function normalizeColor(color){

    if(
        !color ||
        color==="transparent"
    ){

        return "#ffffff";
    }

    if(/^#[0-9a-f]{6}$/i.test(color)){
        return color;
    }

    if(/^#[0-9a-f]{3}$/i.test(color)){

        return "#" +
            color[1]+color[1] +
            color[2]+color[2] +
            color[3]+color[3];
    }

    return "#ffffff";
}


function safeFilename(name){

    return String(name)
        .replace(/[\\/:*?"<>|]+/g,"_")
        .trim() ||
        "presentation";
}


function downloadBlob(
    blob,
    filename
){

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        1000
    );
}

    document.getElementById(

            : "Nothing selected";

    const slide=getSlide();

    if(slide){

        document.getElementById(
            "speakerNotes"
        ).value=
            slide.notes || "";
    }
}
