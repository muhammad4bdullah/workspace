========================================================= */

function handleAction(action){

    switch(action){

        case"new":
            newPresentation();
            break;

        case"open-json":
            document.getElementById(
                "openInput"
            ).click();
            break;

        case"templates":
            showTemplateGallery();
            break;

        case"save":
            save();
            toast("Saved");
            break;

        case"export-json":
            exportJSON();
            break;

        case"export-pptx":
            exportPPTX();
            break;

        case"export-png":
            exportPNG();
            break;

        case"print":
            printSlides();
            break;

        case"rename":
            renamePresentation();
            break;

        case"undo":
            undo();
            break;

        case"redo":
            redo();
            break;

        case"cut":
            cutSelected();
            break;

        case"copy":
            copySelected();
            break;

        case"paste":
            pasteSelected();
            break;

        case"delete":
            deleteSelected();
            break;

        case"select-all":
            selectedIds=
                getSlide()
                    .elements
                    .map(e=>e.id);

            renderAll();
            break;

        case"grid":
            state.showGrid=!state.showGrid;
            renderCanvas();
            break;

        case"guides":
            state.showGuides=!state.showGuides;
            renderCanvas();
            break;

        case"zoom-in":
            zoomIn();
            break;

        case"zoom-out":
            zoomOut();
            break;

        case"zoom-reset":
            setZoom(100);
            break;

        case"fullscreen":
            toggleFullscreen();
            break;

        case"present":
            startPresentation();
            break;

        case"text":
            addText();
            break;

        case"shape":
            addShape("rounded");
            break;

        case"line":
            addLine(false);
            break;

        case"arrow":
            addLine(true);
            break;

        case"image":
            addImage();
            break;

        case"table":
            addTable();
            break;

        case"duplicate-slide":
            duplicateSlide();
            break;

        case"bold":
            toggleBold();
            break;

        case"italic":
            toggleItalic();
            break;

        case"underline":
            toggleUnderline();
            break;

        case"bring-front":
            bringFront();
            break;

        case"bring-forward":
            bringForward();
            break;

        case"send-backward":
            sendBackward();
            break;

        case"send-back":
            sendBack();
            break;

        case"group":
            groupSelected();
            break;

        case"ungroup":
            ungroupSelected();
            break;

        case"new-slide":
            addSlide();
            break;

        case"delete-slide":
            deleteSlide();
            break;

        case"rename-slide":
            renameSlide();
            break;

        case"layout-title":
            applyLayout("title");
            break;

        case"layout-title-content":
            applyLayout("title-content");

        case"layout-blank":
            applyLayout("blank");
            break;

function createPresentationTemplate(templateId){

    const template=PRESENTATION_TEMPLATES.find(
        item=>item.id===templateId
    );

    if(!template){
        throw new Error("The selected template is unavailable.");
    }

    const slides=template.slides.map(
        (page,index)=>{

            const slide={
                id:uid("slide"),
                name:page.title,
                background:{
                    type:"solid",
                    color:page.cover
                        ? template.dark
                        : "#ffffff"
                },
                notes:"",
                transition:"none",
                elements:[]
            };

            const addText=(
                x,y,w,h,text,size,color,weight="400"
            )=>{
                const element=createTextElement(
                    x,y,w,h,text,
                    {
                        fontFamily:"Arial",
                        fontSize:size,
                        color,
                        fontWeight:weight,
                        padding:0
                    }
                );
                element.z=slide.elements.length;
                slide.elements.push(element);
            };

            const addShape=(x,y,w,h,fill,shape="rectangle")=>{
                const element=createShapeElement(
                    x,y,w,h,shape
                );
                element.fill=fill;
                element.stroke=fill;
                element.strokeWidth=0;
                element.z=slide.elements.length;
                slide.elements.push(element);
            };

            if(page.cover){

                addShape(0,0,18,540,template.accent);
                addText(90,105,780,35,template.name.toUpperCase(),16,template.accent,"700");
                addText(90,175,780,145,page.title,56,"#ffffff","700");
                addText(94,340,720,80,page.subtitle,25,"#dbe4f0");
                addShape(94,455,115,5,template.accent);
                addText(94,478,780,30,"EDITABLE PRESENTATION TEMPLATE",13,"#c1ccdc","700");
            }else{

                addShape(0,0,12,540,template.accent);
                addText(70,42,820,24,`${template.name.toUpperCase()}  /  ${String(index).padStart(2,"0")}`,13,template.accent,"700");
                addText(70,82,820,64,page.title,38,"#172033","700");
                addText(70,155,815,56,page.subtitle,19,"#64748b");
                addShape(70,224,820,2,"#e2e8f0");

                page.bullets.forEach(
                    (bullet,bulletIndex)=>{
                        const top=255+bulletIndex*75;
                        addShape(76,top+8,14,14,template.accent,"circle");
                        addText(108,top,755,52,bullet,22,"#273449");
                    }
                );

                addText(70,498,820,22,"[Add your name, team, or presentation date]",12,"#94a3b8");
            }

            return slide;
        }
    );

    return {
        name:template.name,
        width:SLIDE_WIDTH,
        height:SLIDE_HEIGHT,
        theme:"light",
        slides,
        activeSlide:0,
        zoom:100,
        showGrid:false,
        showGuides:true
    };
}


function applyPresentationTemplate(templateId){

    const template=PRESENTATION_TEMPLATES.find(
        item=>item.id===templateId
    );

    if(!template){
        toast("That template is not available");
        return;
    }

    showConfirm(
        "Use template",
        `Replace the current presentation with “${template.name}”?`,
        ()=>{

            try{

                pushHistory();
                state=createPresentationTemplate(templateId);
                selectedIds=[];

                document.getElementById(
                    "presentationName"
                ).value=state.name;

                renderAll();
                save();
                toast(`${template.name} template created`);

            }catch(err){

                console.error("Could not create template",err);
                toast(
                    "Could not create template: "+
                    (err?.message||"Unexpected error")
                );
            }
        }
    );
}

const JSZIP_URL =
    "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js";


function loadBrowserLibrary(
    globalName,
    url
){

    if(window[globalName]){
        return Promise.resolve(window[globalName]);
    }

    return new Promise(
        (resolve,reject)=>{

            const existing=
                document.querySelector(
                    `script[data-library="${globalName}"]`
                );

            if(existing){
                if(existing.dataset.loaded==="true"){
                    reject(
                        new Error(
                            `${globalName} did not initialize`
                        )
                    );
                    return;
                }

                if(existing.dataset.failed==="true"){
                    reject(
                        new Error(
                            `Could not load ${globalName}. Check your internet connection.`
                        )
                    );
                    return;
                }

                existing.addEventListener(
                    "load",
                    ()=>resolve(window[globalName]),
                    {once:true}
                );

                existing.addEventListener(
                    "error",
                    ()=>reject(
                        new Error(
                            `Could not load ${globalName}. Check your internet connection.`
                        )
                    ),
                    {once:true}
                );

                return;
            }

            const script=
                document.createElement("script");

            script.src=url;
            script.async=true;
            script.dataset.library=globalName;

            script.onload=()=>{
                script.dataset.loaded="true";

                if(!window[globalName]){
                    reject(
                        new Error(
                            `${globalName} did not initialize`
                        )
                    );
                    return;
                }

                resolve(window[globalName]);
            };

            script.onerror=()=>{
                script.dataset.failed="true";
                reject(
                    new Error(
                        `Could not load ${globalName}. Check your internet connection.`
                    )
                );
            };

            document.head.appendChild(script);
        }
    );
}


function pptxColor(value,fallback="FFFFFF"){

    const color=String(value||"")
        .trim()
        .replace(/^#/,"");

    return /^[0-9a-f]{6}$/i.test(color)
        ? color.toUpperCase()
        : fallback;
}


function pptxSolidFill(color,opacity=1){

    const alpha=
        opacity<1
            ? `<a:alpha val="${Math.round(Math.max(0,opacity)*100000)}"/>`
            : "";

    return `<a:solidFill><a:srgbClr val="${pptxColor(color)}">${alpha}</a:srgbClr></a:solidFill>`;
}


function pptxTransform(element){

    const left=Math.round(element.x*12700);
    const top=Math.round(element.y*12700);
    const width=Math.max(1,Math.round(element.w*12700));
    const height=Math.max(1,Math.round(element.h*12700));
    const rotation=element.rotation
        ? ` rot="${Math.round(element.rotation*60000)}"`
        : "";

    return `<a:xfrm${rotation}><a:off x="${left}" y="${top}"/><a:ext cx="${width}" cy="${height}"/></a:xfrm>`;
}


function pptxTextBody(element){

    const lines=String(element.text||"").split(/\r?\n/);
    const fontSize=Math.max(1,Math.round((element.fontSize||24)*75));
    const bold=
        String(element.fontWeight)==="700" ||
        Number(element.fontWeight)>=600
            ? ' b="1"'
            : "";
    const italic=element.fontStyle==="italic"
        ? ' i="1"'
        : "";
    const underline=element.textDecoration==="underline"
        ? ' u="sng"'
        : "";
    const align={
        center:"ctr",
        right:"r",
        justify:"just"
    }[element.align]||"l";
    const anchor={
        middle:"ctr",
        bottom:"b"
    }[element.verticalAlign]||"t";
    const font=escapeAttr(element.fontFamily||"Arial");
    const runProperties=
        `<a:rPr lang="en-US" sz="${fontSize}"${bold}${italic}${underline}>`+
        `${pptxSolidFill(element.color||"#111111")}`+
        `<a:latin typeface="${font}"/></a:rPr>`;

    const paragraphs=lines.map(
        line=>`
            <a:p>
                <a:pPr algn="${align}"/>
                <a:r>
                    ${runProperties}
                    <a:t xml:space="preserve">${escapeHTML(line)}</a:t>
                </a:r>
                <a:endParaRPr lang="en-US" sz="${fontSize}"/>
            </a:p>
        `
    ).join("");

    return `<p:txBody><a:bodyPr wrap="square" anchor="${anchor}"><a:normAutofit/></a:bodyPr><a:lstStyle/>${paragraphs}</p:txBody>`;
}


function pptxShapeXml(
    element,id,name,geometry,fill,stroke,strokeWidth,text
){

    const opacity=Math.max(0,Math.min(1,element.opacity??1));
    const shapeFill=fill
        ? pptxSolidFill(fill,opacity)
        : "<a:noFill/>";
    const line=stroke
        ? `<a:ln w="${Math.max(0,Math.round((strokeWidth||1)*12700))}">${pptxSolidFill(stroke,opacity)}</a:ln>`
        : "<a:ln><a:noFill/></a:ln>";

    return `
        <p:sp>
            <p:nvSpPr>
                <p:cNvPr id="${id}" name="${escapeAttr(name)}"/>
                <p:cNvSpPr${text?' txBox="1"':""}/>
                <p:nvPr/>
            </p:nvSpPr>
            <p:spPr>
                ${pptxTransform(element)}
                <a:prstGeom prst="${geometry}"><a:avLst/></a:prstGeom>
                ${shapeFill}
                ${line}
            </p:spPr>
            ${text?pptxTextBody(element):""}
        </p:sp>
    `;
}


function pptxImageXml(element,id,name,relationshipId){

    return `
        <p:pic>
            <p:nvPicPr>
                <p:cNvPr id="${id}" name="${escapeAttr(name)}"/>
                <p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr>
                <p:nvPr/>
            </p:nvPicPr>
            <p:blipFill>
                <a:blip r:embed="${relationshipId}"/>
                <a:stretch><a:fillRect/></a:stretch>
            </p:blipFill>
            <p:spPr>
                ${pptxTransform(element)}
                <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
            </p:spPr>
        </p:pic>
    `;
}


function pptxTableShapes(element,idStart){

    const xml=[];
    const rows=Math.max(1,element.rows||1);
    const cols=Math.max(1,element.cols||1);
    const cellWidth=element.w/cols;
    const cellHeight=element.h/rows;
    let id=idStart;

    for(let row=0;row<rows;row++){
        for(let col=0;col<cols;col++){

            const header=row===0;
            const x=element.x+col*cellWidth;
            const y=element.y+row*cellHeight;
            const cell={
                ...element,
                x,y,
                w:cellWidth,
                h:cellHeight,
                rotation:0,
                opacity:element.opacity??1,
                text:String(element.data?.[row]?.[col]??""),
                fontSize:element.fontSize||16,
                fontFamily:"Arial",
                fontWeight:header?"700":"400",
                fontStyle:"normal",
                textDecoration:"none",
                color:header
                    ? element.headerColor||"#ffffff"
                    : "#111111",
                align:"left",
                verticalAlign:"middle"
            };

            xml.push(
                pptxShapeXml(
                    cell,id++,
                    `Table cell ${row+1}-${col+1}`,
                    "rect",
                    header
                        ? element.headerFill||"#2563eb"
                        : element.cellFill||"#ffffff",
                    element.borderColor||"#94a3b8",
                    1,
                    false
                ).replace(
                    "</p:sp>",
                    `${pptxTextBody(cell)}</p:sp>`
                )
            );
        }
    }

    return {xml:xml.join(""),nextId:id};
}


function pptxNotesSlideXml(notes){

    const textElement=createTextElement(
        48,288,576,432,String(notes),
        {
            fontSize:14,
            color:"#111111"
        }
    );

    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
        <p:notes xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
                 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
                 xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
            <p:cSld>
                <p:spTree>
                    <p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
                    <p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
                    <p:sp>
                        <p:nvSpPr>
                            <p:cNvPr id="2" name="Notes Placeholder"/>
                            <p:cNvSpPr txBox="1"/>
                            <p:nvPr><p:ph type="body" idx="1"/></p:nvPr>
                        </p:nvSpPr>
                        <p:spPr>
                            <a:xfrm><a:off x="457200" y="2743200"/><a:ext cx="5486400" cy="4114800"/></a:xfrm>
                            <a:prstGeom prst="rect"><a:avLst/></a:prstGeom>
                            <a:noFill/>
                            <a:ln><a:noFill/></a:ln>
                        </p:spPr>
                        ${pptxTextBody(textElement)}
                    </p:sp>
                </p:spTree>
            </p:cSld>
            <p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr>
        </p:notes>`;
}


function pptxSlideXml(slide,slideIndex,dimensions){

    const imageRels=[];
    const items=[];
    let nextId=2;

    [...slide.elements]
        .sort((a,b)=>(a.z||0)-(b.z||0))
        .forEach(
            element=>{

                if(element.type==="table"){

                    const table=pptxTableShapes(element,nextId);
                    nextId=table.nextId;
                    items.push(table.xml);
                    return;
                }

                if(element.type==="image"){

                    const match=typeof element.src==="string"
                        ? element.src.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([\s\S]+)$/)
                        : null;

                    if(!match){
                        console.warn(
                            "Skipped image that is not embedded as a data URL",
                            element.id
                        );
                        return;
                    }

                    const mime=match[1].toLowerCase();
                    const extension={
                        "image/jpeg":"jpg",
                        "image/jpg":"jpg",
                        "image/png":"png",
                        "image/gif":"gif",
                        "image/bmp":"bmp",
                        "image/svg+xml":"svg"
                    }[mime];

                    if(!extension){
                        console.warn(
                            "Skipped unsupported PowerPoint image type",
                            mime
                        );
                        return;
                    }

                    const imageNumber=imageRels.length+1;
                    const mediaPath=`ppt/media/image${slideIndex+1}-${imageNumber}.${extension}`;
                    const relationshipId=`rId${imageNumber+1}`;

                    imageRels.push({
                        relationshipId,
                        mediaPath,
                        extension,
                        base64:match[2]
                    });

                    items.push(
                        pptxImageXml(
                            element,
                            nextId++,
                            `Image ${imageNumber}`,
                            relationshipId
                        )
                    );
                    return;
                }

                if(element.type==="text"){
                    items.push(
                        pptxShapeXml(
                            element,
                            nextId++,
                            "Text",
                            "rect",
                            element.background &&
                            element.background!=="transparent"
                                ? element.background
                                : null,
                            null,
                            0,
                            true
                        )
                    );
                    return;
                }

                if(element.type==="shape"){

                    const geometry={
                        circle:"ellipse",
                        pill:"roundRect",
                        rounded:"roundRect",
                        diamond:"diamond"
                    }[element.shape]||"rect";

                    items.push(
                        pptxShapeXml(
                            element,
                            nextId++,
                            "Shape",
                            geometry,
                            element.fill||"#3b82f6",
                            element.stroke||"#1e40af",
                            element.strokeWidth||1,
                            false
                        )
                    );
                    return;
                }

                if(element.type==="line"){

                    const arrow=element.endArrow
                        ? '<a:tailEnd type="triangle"/>'
                        : "";

                    items.push(
                        `
                            <p:sp>
                                <p:nvSpPr>
                                    <p:cNvPr id="${nextId++}" name="Line"/>
                                    <p:cNvSpPr/>
                                    <p:nvPr/>
                                </p:nvSpPr>
                                <p:spPr>
                                    ${pptxTransform(element)}
                                    <a:prstGeom prst="line"><a:avLst/></a:prstGeom>
                                    <a:noFill/>
                                    <a:ln w="${Math.max(1,Math.round((element.strokeWidth||1)*12700))}">
                                        ${pptxSolidFill(element.stroke||"#111111",element.opacity??1)}
                                        ${arrow}
                                    </a:ln>
                                </p:spPr>
                            </p:sp>
                        `
                    );
                }
            }
        );

    const cx=dimensions.width;
    const cy=dimensions.height;
    const background=pptxColor(
        slide.background?.color,
        "FFFFFF"
    );

    return {
        imageRels,
        xml:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
            <p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
                   xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
                   xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
                <p:cSld name="${escapeAttr(slide.name||`Slide ${slideIndex+1}`)}">
                    <p:bg><p:bgPr>${pptxSolidFill("#"+background)}<a:effectLst/></p:bgPr></p:bg>
                    <p:spTree>
                        <p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
                        <p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
                        ${items.join("")}
                    </p:spTree>
                </p:cSld>
                <p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr>
            </p:sld>`
    };
}


async function exportPPTX(){

    try{

        save();

        const JSZip=
            await loadBrowserLibrary(
                "JSZip",
                JSZIP_URL
            );

        const zip=new JSZip();
        const dimensions={
            width:Math.round(state.width*12700),
            height:Math.round(state.height*12700)
        };

        const slideResults=state.slides.map(
            (slide,index)=>
                pptxSlideXml(slide,index,dimensions)
        );

        const imageExtensions=new Set();

        slideResults.forEach(
            (result,index)=>{
                zip.file(
                    `ppt/slides/slide${index+1}.xml`,
                    result.xml
                );

                const relationships=[
                    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>`
                ];

                result.imageRels.forEach(
                    image=>{
                        imageExtensions.add(image.extension);
                        zip.file(
                            image.mediaPath,
                            image.base64,
                            {base64:true}
                        );
                        relationships.push(
                            `<Relationship Id="${image.relationshipId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${image.mediaPath.split("/").pop()}"/>`
                        );
                    }
                );

                const sourceSlide=state.slides[index];
                const notesRelationshipId=
                    `rId${result.imageRels.length+2}`;

                if(sourceSlide.notes){

                    relationships.push(
                        `<Relationship Id="${notesRelationshipId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesSlide" Target="../notesSlides/notesSlide${index+1}.xml"/>`
                    );

                    zip.file(
                        `ppt/notesSlides/notesSlide${index+1}.xml`,
                        pptxNotesSlideXml(sourceSlide.notes)
                    );

                    zip.file(
                        `ppt/notesSlides/_rels/notesSlide${index+1}.xml.rels`,
                        `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="../slides/slide${index+1}.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesMaster" Target="../notesMasters/notesMaster1.xml"/></Relationships>`
                    );
                }

                zip.file(
                    `ppt/slides/_rels/slide${index+1}.xml.rels`,
                    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${relationships.join("")}</Relationships>`
                );
            }
        );

        const contentTypes=[
            `<Default Extension="xml" ContentType="application/xml"/>`,
            `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>`
        ];

        const mimeByExtension={
            png:"image/png",
            jpg:"image/jpeg",
            gif:"image/gif",
            bmp:"image/bmp",
            svg:"image/svg+xml"
        };

        imageExtensions.forEach(
            extension=>{
                contentTypes.push(
                    `<Default Extension="${extension}" ContentType="${mimeByExtension[extension]}"/>`
                );
            }
        );

        contentTypes.push(
            `<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>`,
            `<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>`,
            `<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>`,
            `<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>`
        );

        const hasSpeakerNotes=state.slides.some(
            slide=>Boolean(slide.notes)
        );

        if(hasSpeakerNotes){
            contentTypes.push(
                `<Override PartName="/ppt/notesMasters/notesMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.notesMaster+xml"/>`
            );
        }

        state.slides.forEach(
            (slide,index)=>{
                contentTypes.push(
                    `<Override PartName="/ppt/slides/slide${index+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`
                );

                if(slide.notes){
                    contentTypes.push(
                        `<Override PartName="/ppt/notesSlides/notesSlide${index+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.notesSlide+xml"/>`
                    );
                }
            }
        );

        zip.file(
            "[Content_Types].xml",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">${contentTypes.join("")}</Types>`
        );

        zip.file(
            "_rels/.rels",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="ppt/presentation.xml"/></Relationships>`
        );

        const slideIds=state.slides.map(
            (_,index)=>
                `<p:sldId id="${256+index}" r:id="rId${index+2}"/>`
        ).join("");

        const presentationRels=[
            `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideMaster" Target="slideMasters/slideMaster1.xml"/>`,
            ...state.slides.map(
                (_,index)=>
                    `<Relationship Id="rId${index+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slide" Target="slides/slide${index+1}.xml"/>`
            )
        ];

        if(hasSpeakerNotes){
            presentationRels.push(
                `<Relationship Id="rId${state.slides.length+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/notesMaster" Target="notesMasters/notesMaster1.xml"/>`
            );
        }

        zip.file(
            "ppt/presentation.xml",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                <p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
                    xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
                    xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">
                    <p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>
                    ${hasSpeakerNotes?`<p:notesMasterIdLst><p:notesMasterId r:id="rId${state.slides.length+2}"/></p:notesMasterIdLst>`:""}
                    <p:sldIdLst>${slideIds}</p:sldIdLst>
                    <p:sldSz cx="${dimensions.width}" cy="${dimensions.height}"/>
                    <p:notesSz cx="6858000" cy="9144000"/>
                    <p:defaultTextStyle><a:defPPr><a:defRPr lang="en-US"/></a:defPPr></p:defaultTextStyle>
                </p:presentation>`
        );

        zip.file(
            "ppt/_rels/presentation.xml.rels",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${presentationRels.join("")}</Relationships>`
        );

        const emptyShapeTree=

        zip.file(

        zip.file(

        zip.file(

        );

        if(hasSpeakerNotes){

            zip.file(
                "ppt/notesMasters/notesMaster1.xml",
                `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:notesMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld>${emptyShapeTree}</p:cSld><p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2" accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6" hlink="hlink" folHlink="folHlink"/><p:notesStyle/></p:notesMaster>`
            );

            zip.file(
                "ppt/notesMasters/_rels/notesMaster1.xml.rels",
                `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="../theme/theme1.xml"/></Relationships>`
            );
        }

        zip.file(
            "ppt/theme/theme1.xml",
            `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
                <a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="A-Zpace">
                    <a:themeElements>
                        <a:clrScheme name="A-Zpace">
                            <a:dk1><a:srgbClr val="202124"/></a:dk1><a:lt1><a:srgbClr val="FFFFFF"/></a:lt1>
                            <a:dk2><a:srgbClr val="44546A"/></a:dk2><a:lt2><a:srgbClr val="E7E6E6"/></a:lt2>
                            <a:accent1><a:srgbClr val="2563EB"/></a:accent1><a:accent2><a:srgbClr val="F97316"/></a:accent2>
                            <a:accent3><a:srgbClr val="059669"/></a:accent3><a:accent4><a:srgbClr val="7C3AED"/></a:accent4>
                            <a:accent5><a:srgbClr val="DB2777"/></a:accent5><a:accent6><a:srgbClr val="0891B2"/></a:accent6>
                            <a:hlink><a:srgbClr val="0563C1"/></a:hlink><a:folHlink><a:srgbClr val="954F72"/></a:folHlink>
                        </a:clrScheme>
                        <a:fontScheme name="A-Zpace"><a:majorFont><a:latin typeface="Arial"/></a:majorFont><a:minorFont><a:latin typeface="Arial"/></a:minorFont></a:fontScheme>
                        <a:fmtScheme name="A-Zpace">
                            <a:fillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:fillStyleLst>
                            <a:lnStyleLst><a:ln w="6350"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="12700"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln><a:ln w="19050"><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:ln></a:lnStyleLst>
                            <a:effectStyleLst><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle><a:effectStyle><a:effectLst/></a:effectStyle></a:effectStyleLst>
                            <a:bgFillStyleLst><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill><a:solidFill><a:schemeClr val="phClr"/></a:solidFill></a:bgFillStyleLst>
                        </a:fmtScheme>
                    </a:themeElements>
                </a:theme>`
        );

        const blob=await zip.generateAsync({
            type:"blob",
            mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation",
            compression:"DEFLATE"
        });

        downloadBlob(
            blob,
            safeFilename(state.name)+".pptx"
        );

        toast("PowerPoint downloaded");

    }catch(err){

        console.error("PowerPoint export failed",err);
        toast(
            "PowerPoint export failed: "+
            (err?.message||"Unexpected export error")
        );
    }
}


function xmlFirst(node,namespace,localName){
    return node.getElementsByTagNameNS(
        namespace,
        localName
    )[0]||null;
}


function xmlText(node){

    return Array.from(
        node.getElementsByTagNameNS(
            "http://schemas.openxmlformats.org/drawingml/2006/main",
            "p"
        )
    ).map(
        paragraph=>Array.from(
            paragraph.getElementsByTagNameNS(
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "t"
            )
        ).map(run=>run.textContent||"").join("")
    ).join("\n");
}


function pptxXmlColor(node,fallback){

    const color=
        xmlFirst(
            node,
            "http://schemas.openxmlformats.org/drawingml/2006/main",
            "srgbClr"
        );

    return color?.getAttribute("val")
        ? "#"+color.getAttribute("val")
        : fallback;
}


function normalizeZipPath(path){

    const parts=[];

    path.split("/").forEach(
        part=>{
            if(!part || part===".") return;
            if(part===".."){
                parts.pop();
            }else{
                parts.push(part);
            }
        }
    );

    return parts.join("/");
}


async function importPPTX(file){

    const JSZip=
        await loadBrowserLibrary(
            "JSZip",
            JSZIP_URL
        );

    const zip=await JSZip.loadAsync(file);
    const presentationFile=zip.file("ppt/presentation.xml");

    if(!presentationFile){
        throw new Error("This is not a valid PowerPoint presentation.");
    }

    const parser=new DOMParser();
    const presentationXml=parser.parseFromString(
        await presentationFile.async("text"),
        "application/xml"
    );

    if(presentationXml.querySelector("parsererror")){
        throw new Error("The PowerPoint presentation XML is invalid.");
    }

    const slideSize=
        xmlFirst(
            presentationXml,
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "sldSz"
        );

    const cx=Number(slideSize?.getAttribute("cx"))||12192000;
    const cy=Number(slideSize?.getAttribute("cy"))||6858000;
    const importedHeight=Math.max(1,Math.round(960*cy/cx));
    const fallbackSlidePaths=Object.keys(zip.files)
        .filter(path=>/^ppt\/slides\/slide\d+\.xml$/.test(path))
        .sort(
            (a,b)=>
                Number(a.match(/slide(\d+)/)[1])-
                Number(b.match(/slide(\d+)/)[1])
        );
    const presentationRelationshipsFile=
        zip.file("ppt/_rels/presentation.xml.rels");
    const presentationRelationships=new Map();

    if(presentationRelationshipsFile){

        const relXml=parser.parseFromString(
            await presentationRelationshipsFile.async("text"),
            "application/xml"
        );

        Array.from(relXml.getElementsByTagName("Relationship"))
            .forEach(
                rel=>{
                    const target=rel.getAttribute("Target")||"";
                    presentationRelationships.set(
                        rel.getAttribute("Id"),
                        normalizeZipPath(
                            target.startsWith("/")
                                ? target.slice(1)
                                : "ppt/"+target
                        )
                    );
                }
            );
    }

    const slideIdList=xmlFirst(
        presentationXml,
        "http://schemas.openxmlformats.org/presentationml/2006/main",
        "sldIdLst"
    );
    const relationshipNamespace=
        "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
    const orderedSlidePaths=Array.from(
        slideIdList?.getElementsByTagNameNS(
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "sldId"
        )||[]
    ).map(
        slideId=>presentationRelationships.get(
            slideId.getAttributeNS(
                relationshipNamespace,
                "id"
            )
        )
    ).filter(
        path=>path&&zip.file(path)
    );
    const slidePaths=orderedSlidePaths.length
        ? orderedSlidePaths
        : fallbackSlidePaths;

    if(!slidePaths.length){
        throw new Error("This PowerPoint file has no readable slides.");
    }

    const importedSlides=[];
    let omittedElements=0;

    for(let slideIndex=0;slideIndex<slidePaths.length;slideIndex++){

        const path=slidePaths[slideIndex];
        const slideXml=parser.parseFromString(
            await zip.file(path).async("text"),
            "application/xml"
        );

        if(slideXml.querySelector("parsererror")){
            throw new Error(`Slide ${slideIndex+1} contains invalid XML.`);
        }

        const importedSlide={
            id:uid("slide"),
            name:`Slide ${slideIndex+1}`,
            background:{
                type:"solid",
                color:"#ffffff"
            },
            notes:"",
            transition:"none",
            elements:[]
        };

        const slideRelPath=
            path.replace(
                /slides\/slide(\d+)\.xml$/,
                "slides/_rels/slide$1.xml.rels"
            );

        const relationshipFile=zip.file(slideRelPath);
        const relationships=new Map();
        const relationshipTypes=new Map();

        if(relationshipFile){

            const relXml=parser.parseFromString(
                await relationshipFile.async("text"),
                "application/xml"
            );

            Array.from(relXml.getElementsByTagName("Relationship"))
                .forEach(
                    rel=>{
                        const target=rel.getAttribute("Target")||"";
                        relationships.set(
                            rel.getAttribute("Id"),
                            normalizeZipPath(
                                target.startsWith("/")
                                    ? target.slice(1)
                                    : "ppt/slides/"+target
                            )
                        );
                        relationshipTypes.set(
                            rel.getAttribute("Id"),
                            rel.getAttribute("Type")||""
                        );
                    }
                );
        }

        const bgNode=xmlFirst(
            slideXml,
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "bg"
        );

        if(bgNode){
            importedSlide.background.color=
                pptxXmlColor(bgNode,"#ffffff");
        }

        const tree=xmlFirst(
            slideXml,
            "http://schemas.openxmlformats.org/presentationml/2006/main",
            "spTree"
        );

        const shapeNodes=Array.from(tree?.children||[])
            .filter(node=>[
                "sp",
                "pic",
                "cxnSp",
                "graphicFrame",
                "grpSp"
            ].includes(node.localName));

        for(const node of shapeNodes){

            if(node.localName==="grpSp"){
                omittedElements++;
                continue;
            }

            const xfrm=xmlFirst(
                node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "xfrm"
            )||xmlFirst(
                node,
                "http://schemas.openxmlformats.org/presentationml/2006/main",
                "xfrm"
            );

            const offset=xmlFirst(
                xfrm||node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "off"
            );

            const extent=xmlFirst(
                xfrm||node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "ext"
            );

            if(!offset||!extent){
                omittedElements++;
                continue;
            }

            const x=Number(offset.getAttribute("x"))/cx*960;
            const y=Number(offset.getAttribute("y"))/cx*960;
            const w=Number(extent.getAttribute("cx"))/cx*960;
            const h=Number(extent.getAttribute("cy"))/cx*960;
            const rotation=Number(xfrm?.getAttribute("rot")||0)/60000;
            const spPr=xmlFirst(
                node,
                "http://schemas.openxmlformats.org/presentationml/2006/main",
                "spPr"
            );
            const geom=xmlFirst(
                spPr||node,
                "http://schemas.openxmlformats.org/drawingml/2006/main",
                "prstGeom"
            );
            const preset=geom?.getAttribute("prst")||"rect";
            const fill=pptxXmlColor(spPr||node,"#3b82f6");
            const stroke=pptxXmlColor(
                xmlFirst(
                    spPr||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "ln"
                )||spPr||node,
                "#1e40af"
            );
            const textBody=xmlFirst(
                node,
                "http://schemas.openxmlformats.org/presentationml/2006/main",
                "txBody"
            );

            if(node.localName==="pic"){

                const blip=xmlFirst(
                    node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "blip"
                );
                const relId=blip?.getAttributeNS(
                    "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
                    "embed"
                );
                const imagePath=relationships.get(relId);
                const imageFile=imagePath&&zip.file(imagePath);

                if(imageFile){

                    const ext=(imagePath.split(".").pop()||"png").toLowerCase();
                    const mime={
                        jpg:"image/jpeg",
                        jpeg:"image/jpeg",
                        png:"image/png",
                        gif:"image/gif",
                        bmp:"image/bmp",
                        svg:"image/svg+xml"
                    }[ext];

                    if(mime){
                        const data=await imageFile.async("base64");
                        const image=createImageElement(
                            x,y,w,h,
                            `data:${mime};base64,${data}`
                        );
                        image.rotation=rotation;
                        importedSlide.elements.push(image);
                    }else{
                        omittedElements++;
                    }
                }else{
                    omittedElements++;
                }

                continue;
            }

            if(node.localName==="graphicFrame"){

                const table=xmlFirst(
                    node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "tbl"
                );

                if(table){

                    const rows=Array.from(
                        table.getElementsByTagNameNS(
                            "http://schemas.openxmlformats.org/drawingml/2006/main",
                            "tr"
                        )
                    ).map(
                        row=>Array.from(
                            row.getElementsByTagNameNS(
                                "http://schemas.openxmlformats.org/drawingml/2006/main",
                                "tc"
                            )
                        ).map(cell=>xmlText(cell))
                    );

                    const cols=Math.max(
                        1,
                        ...rows.map(row=>row.length)
                    );

                    if(rows.length&&cols){

                        const importedTable=createTableElement(
                            x,y,w,h,rows.length,cols
                        );
                        importedTable.data=rows.map(
                            row=>Array.from(
                                {length:cols},
                                (_,index)=>row[index]||""
                            )
                        );
                        importedSlide.elements.push(importedTable);
                    }
                }else{
                    omittedElements++;
                }

                continue;
            }

            const text=xmlText(textBody||node);

            if(node.localName==="cxnSp"){

                const line=createLineElement(
                    x,y,Math.max(1,w),Math.max(1,h),
                    Boolean(
                        xmlFirst(
                            spPr||node,
                            "http://schemas.openxmlformats.org/drawingml/2006/main",
                            "tailEnd"
                        )
                    )
                );
                line.stroke=stroke;
                line.rotation=rotation;
                importedSlide.elements.push(line);
                continue;
            }

            const hasFill=Boolean(
                xmlFirst(
                    spPr||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "solidFill"
                )
            );

            if(text.trim()){

                const properties=xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "rPr"
                )||xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "defRPr"
                );

                const textColor=pptxXmlColor(
                    properties||node,
                    "#111111"
                );
                const latin=xmlFirst(
                    properties||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "latin"
                );
                const paragraph=xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "pPr"
                );
                const alignCode=paragraph?.getAttribute("algn");
                const bodyProperties=xmlFirst(
                    textBody||node,
                    "http://schemas.openxmlformats.org/drawingml/2006/main",
                    "bodyPr"
                );

                const textElement=createTextElement(
                    x,y,Math.max(1,w),Math.max(1,h),text,
                    {
                        fontFamily:latin?.getAttribute("typeface")||"Arial",
                        fontSize:Math.max(
                            8,
                            Number(properties?.getAttribute("sz")||1800)/100*4/3
                        ),
                        fontWeight:properties?.getAttribute("b")==="1"
                            ? "700"
                            : "400",
                        fontStyle:properties?.getAttribute("i")==="1"
                            ? "italic"
                            : "normal",
                        textDecoration:properties?.getAttribute("u") &&
                                       properties.getAttribute("u")!=="none"
                            ? "underline"
                            : "none",
                        color:textColor,
                        align:alignCode==="ctr"
                            ? "center"
                            : alignCode==="r"
                                ? "right"
                                : "left",
                        verticalAlign:bodyProperties?.getAttribute("anchor")==="ctr"
                            ? "middle"
                            : bodyProperties?.getAttribute("anchor")==="b"
                                ? "bottom"
                                : "top"
                    }
                );
                textElement.rotation=rotation;
                importedSlide.elements.push(textElement);

                if(hasFill){
                    const shape=createShapeElement(x,y,w,h,
                        preset==="ellipse"
                            ? "circle"
                            : preset==="roundRect"
                                ? "rounded"
                                : preset==="diamond"
                                    ? "diamond"
                                    : "rectangle"
                    );
                    shape.fill=fill;
                    shape.stroke=stroke;
                    shape.rotation=rotation;
                    shape.z=-1;
                    importedSlide.elements.push(shape);
                }
            }else if(node.localName==="sp"&&hasFill){

                const shape=createShapeElement(
                    x,y,w,h,
                    preset==="ellipse"
                        ? "circle"
                        : preset==="roundRect"
                            ? "rounded"
                            : preset==="diamond"
                                ? "diamond"
                                : "rectangle"
                );
                shape.fill=fill;
                shape.stroke=stroke;
                shape.rotation=rotation;
                importedSlide.elements.push(shape);
            }else{
                omittedElements++;
            }
        }

        const notesRelationship=
            Array.from(relationshipTypes.entries())
                .find(([,type])=>type.endsWith("/notesSlide"));

        if(notesRelationship){

            const notesPath=relationships.get(
                notesRelationship[0]
            );
            const notesFile=notesPath&&zip.file(notesPath);

            if(notesFile){

                const notesXml=parser.parseFromString(
                    await notesFile.async("text"),
                    "application/xml"
                );
                const noteShapes=Array.from(
                    notesXml.getElementsByTagNameNS(
                        "http://schemas.openxmlformats.org/presentationml/2006/main",
                        "sp"
                    )
                );
                const bodyPlaceholder=noteShapes.find(
                    shape=>{
                        const placeholder=xmlFirst(
                            shape,
                            "http://schemas.openxmlformats.org/presentationml/2006/main",
                            "ph"
                        );

                        return placeholder?.getAttribute("type")==="body";
                    }
                );

                if(bodyPlaceholder){
                    importedSlide.notes=xmlText(
                        xmlFirst(
                            bodyPlaceholder,
                            "http://schemas.openxmlformats.org/presentationml/2006/main",
                            "txBody"
                        )
                    );
                }
            }
        }

        importedSlides.push(importedSlide);
    }

    return {
        name:file.name.replace(/\.pptx$/i,"")||"Imported Presentation",
        width:960,
        height:importedHeight,
        theme:"light",
        slides:importedSlides,
        activeSlide:0,
        zoom:100,
        showGrid:false,
        showGuides:true,
        omittedElements
    };
}


/* =========================================================
   IMPORT JSON
========================================================= */

document.getElementById(
    "openInput"
).addEventListener(
    "change",
    async e=>{

        const file=e.target.files?.[0];

        if(!file) return;

        try{

            const imported=
                /\.pptx$/i.test(file.name)
                    ? await importPPTX(file)
                    : JSON.parse(await file.text());

            if(
                !imported ||
                !Array.isArray(
                    imported.slides
                )
            ){

                throw new Error(
                    "Invalid presentation file"
                );
            }

            const {
                omittedElements=0,
                ...presentation
            }=imported;

            pushHistory();

            state=Object.assign(
                state,
                presentation
            );

            selectedIds=[];

            document.getElementById(
                "presentationName"
            ).value=state.name;

            renderAll();
            save();

            toast("Presentation opened");

            if(omittedElements){
                toast(
                    `Opened with ${omittedElements} unsupported item(s) omitted`
                );
            }

        }catch(err){

            console.error("Could not open presentation",err);

            toast(
                "Could not open presentation: "+
                (err?.message||"Invalid file")
            );
        }

        e.target.value="";
    }
);

async function exportPNG(){

    const slide=getSlide();

    if(!slide) return;

    const canvas=
        document.createElement("canvas");

    const scale=2;

    canvas.width=
        state.width*scale;

    canvas.height=
        state.height*scale;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle=
        slide.background?.color ||
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const svg=
        `
        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="${state.width}"
            height="${state.height}"
        >
            <foreignObject
                width="100%"
                height="100%"
            >
                ${renderSlideStaticHTML(
                    slide,
                    false
                )}
            </foreignObject>
        </svg>
        `;

    const blob=
        new Blob(
            [svg],
            {
                type:"image/svg+xml"
            }
        );

    const url=
        URL.createObjectURL(blob);

    const image=
        new Image();

    image.onload=()=>{

        ctx.drawImage(
            image,
            0,
            0,
            canvas.width,
            canvas.height
        );

        URL.revokeObjectURL(url);

        canvas.toBlob(
            png=>{
                downloadBlob(
                    png,
                    safeFilename(
                        slide.name
                    )+".png"
                );
            },
            "image/png"
        );
    };

    image.onerror=()=>{

        URL.revokeObjectURL(url);

        toast(
            "PNG export is not supported by this browser"
        );
    };

    image.src=url;
}


/* =========================================================

========================================================= */

function printSlides(){

    const original=
        document.body.innerHTML;

    let html="";

    state.slides.forEach(
        slide=>{

            html+=`
                <div
                    class="print-slide"
                    style="
                        width:100vw;
                        aspect-ratio:${state.width}/${state.height};
                        position:relative;
                        overflow:hidden;
                        background:${escapeAttr(
                            slide.background?.color ||
                            "#ffffff"
                        )};
                        page-break-after:always;
                    "
                >
                    ${renderSlideStaticHTML(
                        slide,
                        false
                    )}
                </div>
            `;
        }
    );

    const printWindow=
        window.open(
            "",
            "_blank"
        );

    if(!printWindow){

        toast("Popup blocked");

        return;
    }

    printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>${escapeHTML(state.name)}</title>
            <style>
                @page{
                    margin:0;
                    size:auto;
                }

                html,body{
                    margin:0;
                    padding:0;
                    background:white;
                }
            </style>
        </head>

        <body>
            ${html}
        <\/body>
        <\/html>
    `);

    printWindow.document.close();

    printWindow.focus();

    setTimeout(
        ()=>{
            printWindow.print();
        },
        500
    );
}

function showModal(
    title,
    body,
    callback
){

    document.getElementById(
        "modalTitle"
    ).textContent=title;

    document.getElementById(
        "modalBody"
    ).innerHTML=body;

    document.getElementById(
        "modalBackdrop"
    ).classList.add("open");

    modalCallback=callback;
}


function closeModal(){

    document.getElementById(
        "modalBackdrop"
    ).classList.remove("open");

    modalCallback=null;
}


document.getElementById(
    "modalClose"
).onclick=closeModal;


document.getElementById(
    "modalCancel"
).onclick=closeModal;


document.getElementById(
    "modalConfirm"
).onclick=()=>{

    if(modalCallback){

        const cb=modalCallback;

        modalCallback=null;

        document.getElementById(
            "modalBackdrop"
        ).classList.remove("open");

        cb();
    }
};

        ()=>{

document.querySelectorAll(
    "[data-context]"
).forEach(
    button=>{

        button.addEventListener(
            "click",
            e=>{

                e.stopPropagation();

                const action=
                    button.dataset.context;

                switch(action){

                    case"copy":
                        copySelected();
                        break;

                    case"cut":
                        cutSelected();
                        break;

                    case"duplicate":
                        pasteSelected();
                        break;

                    case"front":
                        bringFront();
                        break;

                    case"back":
                        sendBack();
                        break;

                    case"delete":

                        if(
                            document.getElementById(
                                "contextMenu"
                            ).dataset.type==="slide"
                        ){

                            deleteSlide();

                        }else{

                            deleteSelected();

                        }

                        break;
                }

                document.getElementById(
                    "contextMenu"
                ).classList.remove("open");
            }
        );
    }
);

/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        const tag=
            document.activeElement?.tagName;

        const editingText =
            tag==="INPUT" ||
            tag==="TEXTAREA" ||
            tag==="SELECT";

        const mod=
            e.ctrlKey ||
            e.metaKey;

        if(
            mod &&
            e.key.toLowerCase()==="z"
        ){

            e.preventDefault();

            undo();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="y"
        ){

            e.preventDefault();

            redo();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="s"
        ){

            e.preventDefault();

            save();

            toast("Saved");

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="n"
        ){

            e.preventDefault();

            newPresentation();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="o"
        ){

            e.preventDefault();

            document.getElementById(
                "openInput"
            ).click();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="p"
        ){

            e.preventDefault();

            printSlides();

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="c"
        ){

            if(!editingText){

                e.preventDefault();

                copySelected();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="x"
        ){

            if(!editingText){

                e.preventDefault();

                cutSelected();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="v"
        ){

            if(!editingText){

                e.preventDefault();

                pasteSelected();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="a"
        ){

            if(!editingText){

                e.preventDefault();

                selectedIds=
                    getSlide()
                        .elements
                        .map(e=>e.id);

                renderAll();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="b"
        ){

            if(!editingText){

                e.preventDefault();

                toggleBold();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="i"
        ){

            if(!editingText){

                e.preventDefault();

                toggleItalic();
            }

            return;
        }

        if(
            mod &&
            e.key.toLowerCase()==="u"
        ){

            if(!editingText){

                e.preventDefault();

                toggleUnderline();
            }

            return;
        }

        if(e.key==="F5"){

            e.preventDefault();

            startPresentation();

            return;
        }

        if(e.key==="Escape"){

            if(
                document.getElementById(
                    "presentation"
                ).classList.contains("open")
            ){

                stopPresentation();

                return;
            }

            selectedIds=[];

            renderAll();

            return;
        }

        if(editingText){
            return;
        }

        if(e.key==="Delete" ||
           e.key==="Backspace"){

            e.preventDefault();

            deleteSelected();

            return;
        }

        if(e.key==="PageDown"){

            e.preventDefault();

            if(
                state.activeSlide<
                state.slides.length-1
            ){

                state.activeSlide++;

                selectedIds=[];

                renderAll();
            }

            return;
        }

        if(e.key==="PageUp"){

            e.preventDefault();

            if(state.activeSlide>0){

                state.activeSlide--;

                selectedIds=[];

                renderAll();
            }

            return;
        }

        if(
            selectedIds.length &&
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(e.key)
        ){

            e.preventDefault();

            const amount=
                e.shiftKey
                    ? 10
                    : 1;

            pushHistory();

            selectedIds.forEach(
                id=>{

                    const el=getElement(id);

                    if(!el) return;

                    if(e.key==="ArrowUp"){
                        el.y-=amount;
                    }

                    if(e.key==="ArrowDown"){
                        el.y+=amount;
                    }

                    if(e.key==="ArrowLeft"){
                        el.x-=amount;
                    }

                    if(e.key==="ArrowRight"){
                        el.x+=amount;
                    }

                }
            );

            renderAll();
            save();
        }
    }
);

/* =========================================================
   DRAG/DROP IMAGE ON CANVAS
========================================================= */

const canvasArea=
    document.getElementById(
        "canvasArea"
    );


document
    .getElementById("slideStage")
    .addEventListener(
        "dragover",
        e=>{
            e.preventDefault();
        }
    );


document
    .getElementById("slideStage")
    .addEventListener(
        "drop",
        e=>{

            e.preventDefault();

            const file=
                e.dataTransfer.files?.[0];

            if(
                file &&
                file.type.startsWith("image/")
            ){

                const reader=
                    new FileReader();

                reader.onload=()=>{

                    pushHistory();

                    const rect=
                        document.getElementById(
                            "slideStage"
                        ).getBoundingClientRect();

                    const scale=
                        state.zoom/100;

                    const x=
                        (e.clientX-rect.left) /
                        scale;

                    const y=
                        (e.clientY-rect.top) /
                        scale;

                    const el=
                        createImageElement(
                            x,
                            y,
                            350,
                            220,
                            reader.result
                        );

                    el.z=nextZ();

                    getSlide()
                        .elements
                        .push(el);

                    selectedIds=[el.id];

                    renderAll();
                    save();
                };

                reader.readAsDataURL(file);
            }
        }
    );


/* =========================================================
   UTILITY: ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttr(value){

    return escapeHTML(value);
}


function normalizeColor(color){

    if(
        !color ||
        color==="transparent"
    ){

        return "#ffffff";
    }

    if(/^#[0-9a-f]{6}$/i.test(color)){
        return color;
    }

    if(/^#[0-9a-f]{3}$/i.test(color)){

        return "#" +
            color[1]+color[1] +
            color[2]+color[2] +
            color[3]+color[3];
    }

    return "#ffffff";
}


function safeFilename(name){

    return String(name)
        .replace(/[\\/:*?"<>|]+/g,"_")
        .trim() ||
        "presentation";
}


function downloadBlob(
    blob,
    filename
){

    const url=
        URL.createObjectURL(blob);

    const a=
        document.createElement("a");

    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        1000
    );
}
